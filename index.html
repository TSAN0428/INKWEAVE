<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨織 InkWeave｜小說設定工坊</title>
  <meta name="description" content="墨織是給小說寫作者的設定管理工具：以章節為骨架，串起角色、角色關係、時間線與伏筆。">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2322242a'/%3E%3Cpath d='M16 5c4.5 6.5 8 10.2 8 14a8 8 0 0 1-16 0c0-3.8 3.5-7.5 8-14z' fill='%23f6f4ef'/%3E%3C/svg%3E">
  <style>
    /* ===== 1. CSS 變數（淺色／深色） ===== */
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-2: #f1eee7;
      --surface-3: #e8e4da;
      --border: #e2ddd2;
      --border-strong: #cdc6b8;
      --text: #22242a;
      --text-muted: #67645d;
      --text-faint: #96928a;
      --ink: #22242a;
      --accent: #4352c4;
      --accent-hover: #36439f;
      --accent-soft: #e8eafb;
      --accent-contrast: #ffffff;
      --danger: #c9302c;
      --danger-soft: #fcebea;
      --warn: #c2410c;
      --warn-soft: #fff0e5;
      --success: #15803d;
      --success-soft: #e6f5eb;
      --neutral-soft: #eceae4;
      --shadow-sm: 0 1px 2px rgba(34, 30, 20, .06);
      --shadow: 0 2px 6px rgba(34, 30, 20, .06), 0 10px 28px rgba(34, 30, 20, .07);
      --shadow-lg: 0 18px 50px rgba(20, 18, 10, .22);
      --radius: 14px;
      --sidebar-w: 236px;
      --topbar-h: 58px;
      --font: system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #14161b;
      --surface: #1c1f26;
      --surface-2: #23272f;
      --surface-3: #2c313b;
      --border: #313642;
      --border-strong: #464c5a;
      --text: #e9e7e2;
      --text-muted: #a6a49e;
      --text-faint: #777670;
      --ink: #e9e7e2;
      --accent: #929eff;
      --accent-hover: #adb6ff;
      --accent-soft: #2a2f56;
      --accent-contrast: #12142a;
      --danger: #f87171;
      --danger-soft: #3b1f22;
      --warn: #fb923c;
      --warn-soft: #3b2717;
      --success: #4ade80;
      --success-soft: #173323;
      --neutral-soft: #2a2e37;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
      --shadow: 0 2px 8px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .25);
      --shadow-lg: 0 18px 50px rgba(0, 0, 0, .55);
      color-scheme: dark;
    }

    /* ===== 2. 基礎樣式與版面（側邊欄、頂部列、內容區） ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
    body { margin: 0; min-height: 100vh; font-family: var(--font); font-size: 15px; line-height: 1.65; color: var(--text); background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3, h4, p { margin: 0; }
    h1, h2, h3, h4 { line-height: 1.35; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    ul, ol { margin: 0; padding: 0; list-style: none; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    ::selection { background: var(--accent-soft); }
    .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
    .muted { color: var(--text-muted); }
    .faint { color: var(--text-faint); }
    .small { font-size: 13px; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .user-text { overflow-wrap: anywhere; white-space: pre-wrap; }
    .only-mobile { display: none !important; }

    .shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; z-index: 50; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 10px; color: var(--text); font-weight: 750; font-size: 17px; letter-spacing: .06em; line-height: 1.2; }
    .brand:hover { text-decoration: none; }
    .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--ink); color: var(--bg); font-size: 18px; font-weight: 800; letter-spacing: 0; box-shadow: var(--shadow-sm); }
    .brand-en { display: block; font-size: 10.5px; font-weight: 650; color: var(--text-faint); letter-spacing: .16em; }
    .sidebar-work { margin: 4px 0 10px; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
    .eyebrow { display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--text-faint); }
    .sidebar-work strong { display: block; margin-top: 2px; font-size: 15px; overflow-wrap: anywhere; line-height: 1.45; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--text-muted); font-weight: 500; }
    .nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
    .nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
    .nav-count { margin-left: auto; font-size: 12px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
    .nav a.active .nav-count { color: inherit; }
    .nav-badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--warn); color: #fff; font-size: 11.5px; font-weight: 700; display: inline-grid; place-items: center; }
    .sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
    .sidebar-foot a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; color: var(--text-muted); font-size: 14px; }
    .sidebar-foot a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
    .nav-backdrop { display: none; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar-h); display: flex; align-items: center; gap: 8px; padding: 0 28px; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    .topbar-title { font-weight: 700; min-width: 0; }
    .topbar-spacer { flex: 1; }
    .search-trigger { display: inline-flex; align-items: center; gap: 8px; height: 36px; min-width: 230px; padding: 0 8px 0 12px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text-muted); font-size: 14px; }
    .search-trigger:hover { border-color: var(--accent); color: var(--text); }
    .search-trigger span { flex: 1; text-align: left; }
    kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-muted); white-space: nowrap; }
    .content { width: 100%; max-width: 1180px; margin: 0 auto; padding: 28px 32px 80px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .page-head > div:first-child { min-width: 0; }
    .page-title { font-size: 26px; font-weight: 750; letter-spacing: .01em; overflow-wrap: anywhere; }
    .page-sub { margin-top: 4px; color: var(--text-muted); overflow-wrap: anywhere; }
    .page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .section-title { display: flex; align-items: center; gap: 8px; margin: 34px 0 12px; font-size: 18px; font-weight: 700; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 14px; font-weight: 500; }
    .back-link:hover { color: var(--text); text-decoration: none; }

    /* ===== 3. 共用元件（按鈕、表單、卡片、對話框、徽章、toast） ===== */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 6px 15px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text); font-weight: 550; line-height: 1.3; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
    .btn:hover { background: var(--surface-2); text-decoration: none; }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn .icon { width: 16px; height: 16px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-danger { color: var(--danger); border-color: var(--border-strong); }
    .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .btn-danger-solid { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn-danger-solid:hover { filter: brightness(.94); background: var(--danger); }
    [data-theme="dark"] .btn-danger-solid { color: #1b0d0d; }
    .btn-ghost { background: transparent; border-color: transparent; }
    .btn-ghost:hover { background: var(--surface-2); }
    .btn-sm { min-height: 30px; padding: 3px 10px; font-size: 13px; border-radius: 8px; }
    .icon-btn { width: 38px; padding: 0; }
    .icon-btn.btn-sm { width: 30px; }
    .btn-group { display: inline-flex; gap: 4px; flex-wrap: wrap; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; min-width: 0; }
    .field:last-child { margin-bottom: 0; }
    .field > label, .label { font-size: 13px; font-weight: 650; color: var(--text-muted); }
    .req { color: var(--danger); }
    .input, .select, .textarea { width: 100%; min-height: 40px; padding: 8px 11px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); color: var(--text); transition: border-color .15s, box-shadow .15s; }
    .textarea { min-height: 84px; resize: vertical; line-height: 1.65; }
    .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .input::placeholder, .textarea::placeholder { color: var(--text-faint); }
    .input-lg { font-size: 20px; font-weight: 700; min-height: 48px; }
    .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
    .hint { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; }
    .form-error { color: var(--danger); font-size: 13.5px; font-weight: 600; margin-top: 4px; }
    .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; user-select: none; }
    .check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 0; }
    input[type="color"] { width: 46px; height: 38px; padding: 3px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); cursor: pointer; }
    input[type="range"] { accent-color: var(--accent); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); min-width: 0; }
    .card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; font-size: 16px; font-weight: 700; }
    .card-title > span { display: inline-flex; align-items: center; gap: 8px; }
    .card-title .icon { color: var(--text-muted); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; background: var(--neutral-soft); color: var(--text-muted); font-size: 12px; font-weight: 650; line-height: 1.7; white-space: nowrap; }
    .badge .icon { width: 13px; height: 13px; }
    .badge-accent { background: var(--accent-soft); color: var(--accent); }
    .badge-success { background: var(--success-soft); color: var(--success); }
    .badge-warn { background: var(--warn-soft); color: var(--warn); }
    .badge-danger { background: var(--danger-soft); color: var(--danger); }
    .badge-solid-warn { background: var(--warn); color: #fff; }
    [data-theme="dark"] .badge-solid-warn { color: #24140a; }
    .type-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }

    .tag { display: inline-flex; align-items: center; padding: 0 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted); font-size: 12px; line-height: 1.8; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; }

    .chip { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 2px 3px 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 550; overflow-wrap: anywhere; }
    .chip button { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 50%; background: transparent; color: inherit; flex: none; }
    .chip button:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .chip button .icon { width: 12px; height: 12px; stroke-width: 2.4; }
    .chip-input { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 42px; padding: 5px 8px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); }
    .chip-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .chip-entry { flex: 1; min-width: 140px; padding: 4px; border: 0; outline: 0; background: transparent; }

    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { padding: 3px 12px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--text-muted); font-size: 13px; font-weight: 550; }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }

    .tabs { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); max-width: 100%; }
    .tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--text-muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .tab .count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--neutral-soft); font-size: 11.5px; line-height: 1.6; }
    .tab.active .count { background: var(--accent-soft); color: var(--accent); }
    .tab.tab-warn .count { background: var(--warn-soft); color: var(--warn); }

    .avatar { --c: #64748b; --fg: #fff; position: relative; display: inline-grid; place-items: center; flex: none; overflow: hidden; border-radius: 50%; background: var(--c); color: var(--fg); font-weight: 750; line-height: 1; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--c); user-select: none; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-xs { width: 22px; height: 22px; font-size: 11px; box-shadow: 0 0 0 1.5px var(--surface); }
    .avatar-sm { width: 30px; height: 30px; font-size: 13px; box-shadow: 0 0 0 2px var(--surface); }
    .avatar-md { width: 44px; height: 44px; font-size: 18px; }
    .avatar-lg { width: 72px; height: 72px; font-size: 28px; }
    .avatar-xl { width: 116px; height: 116px; font-size: 46px; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5.5px var(--c); }
    .avatar-stack { display: inline-flex; align-items: center; }
    .avatar-stack .avatar + .avatar { margin-left: -6px; }

    .picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .pick-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 13.5px; user-select: none; max-width: 100%; }
    .pick-chip input { position: absolute; opacity: 0; pointer-events: none; }
    .pick-chip:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 650; }
    .pick-chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
    .pick-list { max-height: 210px; overflow-y: auto; border: 1px solid var(--border-strong); border-radius: 9px; padding: 4px; }
    .pick-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 14px; }
    .pick-row:hover { background: var(--surface-2); }
    .pick-row input { width: 16px; height: 16px; accent-color: var(--accent); flex: none; }

    .empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 44px 20px; border: 1.5px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text-muted); }
    .empty .icon { width: 36px; height: 36px; stroke-width: 1.4; color: var(--text-faint); margin-bottom: 4px; }
    .empty h3 { color: var(--text); font-size: 17px; }
    .empty .row { justify-content: center; margin-top: 10px; }
    .empty-inline { padding: 14px; border-radius: 10px; background: var(--surface-2); color: var(--text-muted); font-size: 14px; text-align: center; }

    .list-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); text-align: left; transition: border-color .15s, background .15s; }
    .list-link:hover { border-color: var(--accent); background: var(--surface-2); }
    .list-link .grow { flex: 1; min-width: 0; }
    .list-link .title { display: block; font-weight: 650; overflow-wrap: anywhere; }
    .list-link .sub { display: block; font-size: 12.5px; color: var(--text-muted); overflow-wrap: anywhere; }
    .list-link > .icon { color: var(--text-faint); }
    .link-list { display: flex; flex-direction: column; gap: 8px; }

    dialog#modal { width: min(580px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); padding: 0; border: 0; border-radius: 16px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); overflow: hidden; }
    dialog#modal.modal-wide { width: min(720px, calc(100vw - 24px)); }
    dialog#modal[open] { display: flex; flex-direction: column; }
    dialog#modal::backdrop { background: rgba(14, 14, 20, .5); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    .modal-form { display: flex; flex-direction: column; min-height: 0; max-height: calc(100dvh - 40px); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 4px 22px; }
    .modal-title { font-size: 18px; font-weight: 750; }
    .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 22px 16px; }
    .modal-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--border); background: var(--surface-2); }
    .confirm-message { line-height: 1.75; overflow-wrap: anywhere; }
    .confirm-message strong { color: var(--text); }
    .impact-list { margin: 10px 0 0; padding: 12px 14px 12px 32px; list-style: disc; background: var(--surface-2); border-radius: 10px; font-size: 14px; }

    #toast { position: fixed; inset: auto auto 24px 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 8px; width: max-content; max-width: calc(100vw - 32px); margin: 0; padding: 0; border: 0; background: transparent; overflow: visible; pointer-events: none; }
    .toast-item { max-width: 100%; padding: 10px 18px; border-radius: 11px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-lg); font-size: 14px; font-weight: 550; opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .2s; overflow-wrap: anywhere; }
    .toast-item.show { opacity: 1; transform: none; }
    .toast-success { background: var(--success); color: #fff; }
    .toast-error { background: var(--danger); color: #fff; }
    .toast-warn { background: var(--warn); color: #fff; }
    [data-theme="dark"] .toast-success, [data-theme="dark"] .toast-error, [data-theme="dark"] .toast-warn { color: #111; }

    .flash { animation: flash 1.8s ease; }
    @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent), var(--shadow); } 100% { box-shadow: 0 0 0 0 transparent; } }

    /* ===== 4. 各頁面樣式 ===== */
    /* --- 載入與錯誤 --- */
    .boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--text-muted); }
    .boot .brand-mark { margin: 0 auto 14px; width: 48px; height: 48px; font-size: 24px; border-radius: 14px; }
    .boot h1 { color: var(--text); font-size: 20px; margin-bottom: 6px; }

    /* --- 作品列表 --- */
    .home { min-height: 100vh; display: flex; flex-direction: column; }
    .home-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 32px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .home-main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding: 44px 32px 56px; }
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
    .hero h1 { font-size: 32px; font-weight: 800; letter-spacing: .02em; }
    .hero p { margin-top: 6px; color: var(--text-muted); max-width: 520px; }
    .work-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
    .work-card { position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 186px; padding: 20px 20px 18px 24px; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s, border-color .15s; }
    .work-card::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 5px; background: var(--accent); }
    .work-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); text-decoration: none; }
    .work-card-title { font-size: 19px; font-weight: 750; overflow-wrap: anywhere; }
    .work-card-desc { color: var(--text-muted); font-size: 14px; overflow-wrap: anywhere; }
    .work-card-meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: auto; color: var(--text-muted); font-size: 13px; }
    .work-card-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .work-card-meta .icon { width: 15px; height: 15px; }
    .work-card-time { padding-top: 10px; border-top: 1px dashed var(--border); color: var(--text-faint); font-size: 12.5px; }
    .home-empty { padding: 56px 24px; }
    .home-empty .ink-art { width: 120px; height: 120px; margin-bottom: 6px; }
    .home-foot { padding: 18px 24px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 13px; text-align: center; }
    .home-foot .icon { width: 15px; height: 15px; margin-right: 4px; }

    /* --- 總覽 --- */
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .stat { display: flex; flex-direction: column; gap: 2px; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); transition: border-color .15s, transform .15s; }
    .stat:hover { border-color: var(--accent); transform: translateY(-1px); text-decoration: none; }
    .stat-label { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 13.5px; font-weight: 600; }
    .stat-value { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
    .stat-value small { font-size: 15px; font-weight: 600; color: var(--text-muted); }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; margin-top: 16px; }
    .current-chapter-box { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--surface-2); }
    .current-chapter-box h4 { font-size: 15px; overflow-wrap: anywhere; }
    .overdue-item { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--warn-soft); }
    .overdue-item:hover { border-color: var(--warn); background: var(--warn-soft); }
    .overdue-item > .icon { color: var(--warn); }
    .recent-type { flex: none; }

    /* --- 章節 --- */
    .chapter-list { display: flex; flex-direction: column; gap: 10px; }
    .chapter-item { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); transition: box-shadow .15s; }
    .chapter-item.is-current { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); }
    .chapter-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 14px 14px 8px; }
    .drag-handle { display: grid; place-items: center; width: 28px; height: 40px; flex: none; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--text-faint); cursor: grab; touch-action: none; }
    .drag-handle:hover { background: var(--surface-2); color: var(--text-muted); }
    .chapter-num { flex: none; width: 74px; padding-top: 7px; font-size: 13px; font-weight: 750; color: var(--accent); letter-spacing: .04em; }
    .chapter-main { flex: 1; min-width: 0; padding-top: 4px; }
    .chapter-main h3 { font-size: 16.5px; font-weight: 700; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chapter-main p { margin-top: 3px; color: var(--text-muted); font-size: 14px; overflow-wrap: anywhere; }
    .chapter-counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chapter-actions { display: flex; align-items: center; gap: 2px; flex: none; }
    .chapter-detail { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 4px 18px 18px 52px; }
    .chapter-detail h4 { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
    .mini-list { display: flex; flex-direction: column; gap: 6px; }
    .mini-item { display: block; width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); text-align: left; font-size: 13.5px; overflow-wrap: anywhere; }
    .mini-item:hover { border-color: var(--accent); }
    .mini-item .sub { display: block; font-size: 12px; color: var(--text-muted); }
    .chapter-list.is-sorting .chapter-item:not(.dragging) { transition: transform .18s ease; }
    .chapter-item.dragging { position: relative; z-index: 5; box-shadow: var(--shadow-lg); opacity: .96; }

    /* --- 角色 --- */
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .search-box { position: relative; flex: 1; min-width: min(100%, 220px); max-width: 360px; }
    .search-box .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search-box .input { padding-left: 36px; }
    .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 14px; }
    .char-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 14px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); text-align: center; box-shadow: var(--shadow-sm); transition: transform .15s, box-shadow .15s, border-color .15s; min-width: 0; }
    .char-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow); text-decoration: none; }
    .char-card .avatar { margin-bottom: 6px; }
    .char-name { font-size: 16.5px; font-weight: 750; overflow-wrap: anywhere; }
    .char-alias { font-size: 12.5px; color: var(--text-muted); overflow-wrap: anywhere; }
    .char-card .tag-list { justify-content: center; }

    .detail-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .save-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: var(--surface-2); color: var(--text-muted); font-size: 13px; font-weight: 600; transition: background .2s, color .2s; }
    .save-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .7; }
    .save-status.is-saving { color: var(--accent); background: var(--accent-soft); }
    .save-status.is-saved { color: var(--success); background: var(--success-soft); }
    .save-status.is-error { color: var(--danger); background: var(--danger-soft); }
    .detail-hero { display: flex; gap: 28px; align-items: flex-start; }
    .detail-avatar-col { display: flex; flex-direction: column; align-items: center; gap: 14px; flex: none; padding-top: 6px; }
    .detail-main-col { flex: 1; min-width: 0; }
    .color-row { display: flex; align-items: center; gap: 10px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
    .detail-grid .card .textarea { min-height: 110px; }
    .secret-wrap { position: relative; }
    .secret-wrap .textarea { transition: filter .25s; }
    .secret-wrap:not(.revealed) .textarea { filter: blur(6px); pointer-events: none; user-select: none; }
    .secret-cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 1.5px dashed var(--border-strong); border-radius: 9px; background: color-mix(in srgb, var(--surface) 35%, transparent); color: var(--text); font-weight: 650; }
    .secret-cover:hover { border-color: var(--accent); color: var(--accent); }
    .secret-wrap.revealed .secret-cover { display: none; }
    .cf-list { display: flex; flex-direction: column; gap: 8px; }
    .cf-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto; gap: 8px; align-items: center; }
    .assoc-list { display: flex; flex-direction: column; gap: 6px; }
    .assoc-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); text-align: left; font-size: 14px; }
    .assoc-item:hover { border-color: var(--accent); }
    .assoc-item .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .assoc-item .sub { display: block; font-size: 12.5px; color: var(--text-muted); }
    .chapter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .danger-zone { margin-top: 28px; border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
    .danger-zone .card-title { color: var(--danger); }
    .danger-zone .row { justify-content: space-between; }

    /* --- 關係圖 --- */
    .graph-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 20px; margin-bottom: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .slider-wrap { display: flex; align-items: center; gap: 12px; flex: 1; min-width: min(100%, 280px); }
    .slider-wrap input[type="range"] { flex: 1; min-width: 80px; }
    .slider-wrap .label { white-space: nowrap; }
    .slider-label { flex: none; max-width: 46%; padding: 3px 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slider-wrap.is-disabled { opacity: .45; }
    .graph-hint { color: var(--text-muted); font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .graph-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 12px; }
    .graph-canvas { position: relative; height: min(70vh, 660px); min-height: 400px; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background-color: var(--surface); background-image: radial-gradient(var(--border) 1.1px, transparent 1.1px); background-size: 22px 22px; box-shadow: var(--shadow-sm); }
    #graph-svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
    #graph-svg.is-panning { cursor: grabbing; }
    .graph-zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    .graph-zoom .btn { width: 34px; min-height: 34px; padding: 0; background: var(--surface); box-shadow: var(--shadow-sm); }
    .graph-panel { max-height: min(70vh, 660px); min-height: 400px; overflow-y: auto; padding: 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .panel-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 30px 6px; color: var(--text-muted); }
    .panel-empty > .icon { width: 34px; height: 34px; color: var(--text-faint); stroke-width: 1.4; }
    .panel-tips { margin-top: 8px; padding: 12px 14px 12px 28px; list-style: disc; text-align: left; font-size: 13px; background: var(--surface-2); border-radius: 10px; }
    .panel-tips li + li { margin-top: 4px; }
    .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .panel-head h3 { font-size: 18px; overflow-wrap: anywhere; }
    .panel-section { margin-top: 16px; }
    .panel-section h4 { margin-bottom: 8px; font-size: 13px; font-weight: 700; color: var(--text-muted); }
    .rel-pair { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
    .rel-pair .who { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; font-weight: 650; font-size: 14px; text-align: center; overflow-wrap: anywhere; }
    .rel-pair .arrow { font-size: 20px; color: var(--text-muted); }
    .phase-list { display: flex; flex-direction: column; gap: 8px; }
    .phase { display: flex; gap: 10px; padding: 10px 10px 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .phase.is-active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .phase .type-dot { margin-top: 7px; }
    .phase-body { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
    .phase-body strong { font-size: 14.5px; }
    .phase-body .sub { font-size: 12.5px; color: var(--text-muted); }
    .phase-body p { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
    .phase-actions { display: flex; flex-direction: column; gap: 2px; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; color: var(--text-muted); }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-line { width: 22px; height: 3px; border-radius: 2px; }
    .node { cursor: pointer; }
    .node-halo { fill: transparent; }
    .node.selected .node-halo { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .node-ring { fill: var(--surface); stroke-width: 3; }
    .node-initial { font-size: 22px; font-weight: 800; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .node-name { fill: var(--text); font-size: 14px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
    .node.dim, .edge.dim { opacity: .22; }
    .node.dragging { cursor: grabbing; }
    .edge { cursor: pointer; }
    .edge-line { fill: none; stroke-width: 2.6; stroke-linecap: round; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 18; }
    .edge-pill { fill: var(--surface); stroke-width: 1.6; }
    .edge-label { fill: var(--text); font-size: 12.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .edge:hover .edge-line { stroke-width: 3.6; }
    .edge.selected .edge-line { stroke-width: 4.6; }
    .edge.selected .edge-pill { stroke-width: 2.6; }

    /* --- 時間線 --- */
    .tl-toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    .tl-filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-left: auto; }
    .tl-filters .select { width: auto; min-width: 140px; max-width: 200px; min-height: 36px; padding: 5px 10px; font-size: 14px; }
    .tl { position: relative; }
    .tl::before { content: ""; position: absolute; top: 10px; bottom: 10px; left: 141px; width: 2px; border-radius: 2px; background: var(--border); }
    .tl-item { display: grid; grid-template-columns: 128px 28px minmax(0, 1fr); align-items: start; padding: 6px 0; }
    .tl-time { padding: 15px 12px 0 0; text-align: right; font-size: 13px; font-weight: 700; color: var(--text-muted); overflow-wrap: anywhere; line-height: 1.4; }
    .tl-time .tl-sort { display: block; margin-top: 2px; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text-faint); }
    .tl-dot { position: relative; z-index: 1; width: 14px; height: 14px; margin: 18px auto 0; border: 3px solid var(--accent); border-radius: 50%; background: var(--surface); }
    .tl-item.is-background .tl-dot { border-style: dashed; border-color: var(--text-faint); }
    .tl-item.is-flashback .tl-dot { border-color: var(--warn); }
    .ev-card { min-width: 0; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .ev-card.is-flashback { border-left: 4px solid var(--warn); }
    .ev-card.is-background { border-style: dashed; }
    .ev-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .ev-title { font-size: 15.5px; font-weight: 750; overflow-wrap: anywhere; }
    .ev-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .ev-desc { margin-top: 8px; color: var(--text-muted); font-size: 14px; }
    .ev-foot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ev-actions { display: flex; gap: 2px; flex: none; }
    .ev-people { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; font-size: 13px; color: var(--text-muted); }
    .chapter-group { margin-bottom: 24px; }
    .chapter-group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-strong); }
    .chapter-group-head .num { color: var(--accent); font-weight: 800; font-size: 14px; letter-spacing: .04em; }
    .chapter-group-head h3 { font-size: 16.5px; overflow-wrap: anywhere; }
    .chapter-group .ev-list { display: flex; flex-direction: column; gap: 10px; padding-left: 14px; border-left: 3px solid var(--surface-3); }
    .dual-wrap { padding: 12px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .dual-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 4px 12px 10px; font-size: 13px; color: var(--text-muted); }
    #dual-svg { display: block; width: 100%; max-width: 820px; height: auto; margin: 0 auto; }
    .dual-head { fill: var(--text-muted); font-size: 13px; font-weight: 750; text-anchor: middle; }
    .dual-title { fill: var(--text); font-size: 13px; font-weight: 650; }
    .dual-meta { fill: var(--text-faint); font-size: 11px; }
    .dual-node { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
    .dual-node.is-flashback { stroke: var(--warn); }
    .dual-node.is-background { stroke: var(--text-faint); stroke-dasharray: 3 2; }
    .dual-link { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .55; transition: opacity .15s, stroke-width .15s; }
    .dual-link.is-flashback { stroke: var(--warn); opacity: .8; }
    .dual-item { cursor: pointer; }
    #dual-svg.has-hl .dual-link, #dual-svg.has-hl .dual-item { opacity: .15; }
    #dual-svg.has-hl .dual-link.hl { opacity: 1; stroke-width: 3.5; }
    #dual-svg.has-hl .dual-item.hl { opacity: 1; }

    /* --- 伏筆 --- */
    .fs-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .fs-stat { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-sm); }
    .fs-stat .stat-value { font-size: 26px; }
    .fs-stat.is-warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--border)); background: var(--warn-soft); }
    .fs-stat.is-warn .stat-value, .fs-stat.is-warn .stat-label { color: var(--warn); }
    .fs-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
    .fs-list { display: flex; flex-direction: column; gap: 10px; }
    .fs-item { display: flex; gap: 14px; padding: 16px 16px 16px 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-sm); }
    .fs-item.is-overdue { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); background: linear-gradient(90deg, var(--warn-soft), var(--surface) 55%); box-shadow: inset 4px 0 0 var(--warn), var(--shadow-sm); }
    .fs-item.is-muted { opacity: .78; }
    .fs-main { flex: 1; min-width: 0; }
    .fs-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .fs-title-row h3 { font-size: 16.5px; font-weight: 750; overflow-wrap: anywhere; }
    .fs-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; color: var(--text-muted); }
    .fs-meta strong { color: var(--text); font-weight: 650; }
    .fs-meta .warn { color: var(--warn); font-weight: 700; }
    .fs-desc { margin-top: 8px; font-size: 14px; color: var(--text-muted); }
    .fs-links { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
    .fs-note { margin-top: 10px; padding: 8px 12px; border-radius: 9px; background: var(--surface-2); font-size: 13.5px; color: var(--text-muted); }
    .fs-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
    .span-card { margin-bottom: 18px; }
    .span-scroll { overflow-x: auto; }
    #span-svg { display: block; width: 100%; height: auto; }
    .span-grid { stroke: var(--border); stroke-width: 1; }
    .span-axis { fill: var(--text-muted); font-size: 11.5px; font-weight: 650; text-anchor: middle; }

    // ===== 2. 工具函式（escapeHtml、uuid、debounce、formatDate、downloadJson） =====
    /** 將使用者文字轉為可安全放入 HTML 的字串（防 XSS） */
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    /** 產生 UUID；crypto.randomUUID 不可用時（例：file:// 開啟）使用後備產生器 */
    function uuid() {
      try {
        if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
      } catch (err) { /* 非安全環境，改用後備 */ }
      const bytes = new Uint8Array(16);
      if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') crypto.getRandomValues(bytes);
      else for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
      return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }

    /** 防抖：停止呼叫 wait 毫秒後才執行；提供 flush()、cancel() */
    function debounce(fn, wait) {
      let timer = null;
      let lastArgs = null;
      const debounced = (...args) => {
        lastArgs = args;
        clearTimeout(timer);
        timer = setTimeout(() => { timer = null; const a = lastArgs; lastArgs = null; fn(...a); }, wait);
      };
      debounced.flush = () => {
        if (timer === null) return;
        clearTimeout(timer);
        timer = null;
        const a = lastArgs;
        lastArgs = null;
        fn(...a);
      };
      debounced.cancel = () => { clearTimeout(timer); timer = null; lastArgs = null; };
      return debounced;
    }

    const nowIso = () => new Date().toISOString();
    const pad2 = (n) => String(n).padStart(2, '0');

    function formatDate(iso, withTime = true) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const date = `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
      return withTime ? `${date} ${pad2(d.getHours())}:${pad2(d.getMinutes())}` : date;
    }

    function fileStamp(d, withTime) {
      const date = `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
      return withTime ? `${date}-${pad2(d.getHours())}${pad2(d.getMinutes())}` : date;

    function downloadJson(data, filename) {

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

      return String(name).replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').replace(/\s+/g, ' ').trim().slice(0, 60) || 'untitled';

    const fmtNum = (n) => (Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000));

    function splitList(text) {
      return uniq(String(text || '').split(/[,，、\n]/).map((s) => s.trim()).filter(Boolean));

    function firstChar(s) { return Array.from(String(s || '').trim())[0] || '?'; }

    /** 依背景色亮度選擇黑或白字 */
    function contrastText(hex) {
      const c = safeColor(hex);
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255)
        .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
      const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return lum > 0.45 ? '#1b1b1f' : '#ffffff';

    }

    function truncateText(s, max) {
      const chars = Array.from(String(s || ''));
      return chars.length > max ? chars.slice(0, max).join('') + '…' : chars.join('');

    function textWidth(s, size) {
      let w = 0;
      for (const ch of String(s)) w += /[\u0000-ɏ]/.test(ch) ? size * 0.6 : size;
      return w;
