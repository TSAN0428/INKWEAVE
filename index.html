    function drawGraph() {
      const svg = document.getElementById('graph-svg');
      const ctx = currentGraphContext();
      if (svg && ctx) svg.innerHTML = graphSvgInner(ctx);
    }

    function drawGraphPanel() {
      const panel = document.getElementById('graph-panel');
      const ctx = currentGraphContext();
      if (panel && ctx) panel.innerHTML = graphPanelHtml(ctx);
    }

    function applyGraphView() {
      const vp = document.getElementById('graph-viewport');
      if (vp) vp.setAttribute('transform', viewTransform(ui.graph.view));
    }

    function svgPoint(svg, evt) {
      const ctm = svg.getScreenCTM();
      if (!ctm) return { x: 0, y: 0 };
      const p = new DOMPoint(evt.clientX, evt.clientY).matrixTransform(ctm.inverse());
      return { x: p.x, y: p.y };
    }

    function zoomGraphAt(p, factor) {
      const v = ui.graph.view;
      const k = clamp(v.k * factor, 0.35, 3);
      const r = k / v.k;
      v.x = p.x - (p.x - v.x) * r;
      v.y = p.y - (p.y - v.y) * r;
      v.k = k;
      applyGraphView();
    }

    /** 關係圖的指標事件（滑鼠與觸控）：拖曳節點、平移、點選 */
    function bindGraphEvents() {
      const svg = document.getElementById('graph-svg');
      if (!svg) return;
      svg.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        const g = ui.graph;
        const p = svgPoint(svg, e);
        const nodeEl = e.target.closest('[data-node-id]');
        const edgeEl = e.target.closest('[data-edge-id]');
        if (nodeEl) {
          const ctx = currentGraphContext();
          const id = nodeEl.dataset.nodeId;
          const pos = nodePositions(ctx.characters, g).get(id);
          const gp = { x: (p.x - g.view.x) / g.view.k, y: (p.y - g.view.y) / g.view.k };
          g.drag = { kind: 'node', id, pointerId: e.pointerId, sx: p.x, sy: p.y, offX: gp.x - pos.x, offY: gp.y - pos.y, pos: null, moved: false };
        } else if (edgeEl) {
          g.drag = { kind: 'edge', id: edgeEl.dataset.edgeId, pointerId: e.pointerId, sx: p.x, sy: p.y, moved: false };
        } else {
          g.drag = { kind: 'pan', pointerId: e.pointerId, sx: p.x, sy: p.y, vx: g.view.x, vy: g.view.y, moved: false };
        }
        try { svg.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
        e.preventDefault();
      });
      svg.addEventListener('pointermove', (e) => {
        const g = ui.graph;
        const d = g.drag;
        if (!d || d.pointerId !== e.pointerId) return;
        const p = svgPoint(svg, e);
        if (!d.moved && Math.hypot(p.x - d.sx, p.y - d.sy) < 4) return;
        d.moved = true;
        if (d.kind === 'node') {
          const gp = { x: (p.x - g.view.x) / g.view.k, y: (p.y - g.view.y) / g.view.k };
          d.pos = { x: clamp(gp.x - d.offX, -1500, 2500), y: clamp(gp.y - d.offY, -1500, 2500) };
          drawGraph();
        } else if (d.kind === 'pan') {
          g.view.x = d.vx + (p.x - d.sx);
          g.view.y = d.vy + (p.y - d.sy);
          svg.classList.add('is-panning');
          applyGraphView();
        }
      });
      const finish = (e, cancelled) => {
        const g = ui.graph;
        const d = g.drag;
        if (!d || d.pointerId !== e.pointerId) return;
        g.drag = null;
        svg.classList.remove('is-panning');
        if (cancelled) { drawGraph(); return; }
        if (d.kind === 'node' && d.moved && d.pos) {
          // 第一次拖曳時，一併固定其他自動排列的節點，避免它們跳動
          const ctx = currentGraphContext();
          const positions = nodePositions(ctx.characters, g);
          positions.set(d.id, d.pos);
          const toSave = new Map([...positions].filter(([id]) => id === d.id || !isValidPos(findById('characters', id)?.graphPosition)));
          saveGraphPositions(ctx.work.id, toSave, { render: false }).catch(() => {});
          drawGraph();
          return;
        }
        if (d.moved) return;
        g.selected = d.kind === 'pan' ? null : { kind: d.kind, id: d.id };
        drawGraph();
        drawGraphPanel();
      };
      svg.addEventListener('pointerup', (e) => finish(e, false));
      svg.addEventListener('pointercancel', (e) => finish(e, true));
      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomGraphAt(svgPoint(svg, e), e.deltaY < 0 ? 1.12 : 1 / 1.12);
      }, { passive: false });
    }

    function phaseFieldsHtml(chapters, phase) {
      return `<div class="form-row">
          <div class="field"><label for="f-type">關係類型</label><select id="f-type" name="type" class="select">${relationTypeOptionsHtml(phase.type)}</select></div>
          <div class="field"><label for="f-start">起始章節</label><select id="f-start" name="startChapterId" class="select">${chapterOptionsHtml(chapters, phase.startChapterId, '故事開始（第 1 章之前）')}</select></div>
        </div>
        <div class="field"><label for="f-label">連線上顯示的文字</label>
          <input id="f-label" name="label" class="input" maxlength="20" value="${escapeHtml(phase.label)}" placeholder="例：青梅竹馬（空白則顯示類型名稱）"></div>
        <div class="field"><label for="f-note">備註</label>
          <textarea id="f-note" name="note" class="textarea" rows="2" placeholder="這個階段的關係狀況…">${escapeHtml(phase.note)}</textarea></div>`;
    }

    function readPhaseForm(fd) {
      const type = str(fd.get('type'));
      return {
        type: Object.prototype.hasOwnProperty.call(RELATION_TYPES, type) ? type : 'other',
        startChapterId: str(fd.get('startChapterId')) || null,
        label: str(fd.get('label')).trim(),
        note: str(fd.get('note')).trim(),
      };
    }

    // --- 時間線 ---
    function timelineData(work) {
      const chapters = getChaptersByWork(work.id);
      const events = getEventsByWork(work.id);
      const flashbacks = markFlashbacks(sortEventsByNarrative(events, chapters));
      const tl = ui.timeline;
      const allTags = uniq(events.flatMap((e) => e.tags)).sort((a, b) => a.localeCompare(b, 'zh-Hant'));
      const characters = getCharactersByWork(work.id);
      if (tl.charId && !characters.some((c) => c.id === tl.charId)) tl.charId = '';
      if (tl.tag && !allTags.includes(tl.tag)) tl.tag = '';
      const filtered = events.filter((e) => (!tl.charId || e.characterIds.includes(tl.charId)) && (!tl.tag || e.tags.includes(tl.tag)));
      return { chapters, events, flashbacks, filtered, allTags, characters };
    }

    function eventCardHtml(work, e, chapters, flashbacks, mode, nav = null) {
      const ch = chapters.find((c) => c.id === e.chapterId);
      const isFb = flashbacks.has(e.id);
      const people = e.characterIds.map((id) => findById('characters', id)).filter(Boolean);
      const badges = [];
      if (mode === 'story') {
        badges.push(`<span class="badge only-mobile">${icon('clock')}${escapeHtml(e.storyTimeLabel || '未設定時間')}</span>`);
        badges.push(ch ? `<span class="badge badge-accent">出現於第 ${ch.order} 章</span>` : '<span class="badge">背景事件</span>');
      } else {
        badges.push(`<span class="badge">${icon('clock')}${escapeHtml(e.storyTimeLabel || '未設定故事時間')}</span>`);
      }
      if (isFb) badges.push('<span class="badge badge-warn">↩ 倒敘</span>');
      badges.push(...e.tags.map((t) => `<span class="tag">#${escapeHtml(t)}</span>`));
      const moveBtns = nav ? `
        <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="move-event" data-id="${escapeHtml(e.id)}" data-dir="-1" title="在本章中上移" aria-label="上移"${nav.first ? ' disabled' : ''}>${icon('up')}</button>
        <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="move-event" data-id="${escapeHtml(e.id)}" data-dir="1" title="在本章中下移" aria-label="下移"${nav.last ? ' disabled' : ''}>${icon('down')}</button>` : '';
      return `<article class="ev-card${isFb ? ' is-flashback' : ''}${ch ? '' : ' is-background'}" id="item-${escapeHtml(e.id)}">
        <div class="ev-head"><div style="min-width:0"><h3 class="ev-title">${escapeHtml(e.title)}</h3><div class="ev-meta">${badges.join('')}</div></div>
          <div class="ev-actions">${moveBtns}
            <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="edit-event" data-id="${escapeHtml(e.id)}" title="編輯" aria-label="編輯">${icon('edit')}</button>
            <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="delete-event" data-id="${escapeHtml(e.id)}" title="刪除" aria-label="刪除">${icon('trash')}</button>
          </div></div>
        ${e.description ? `<p class="ev-desc user-text">${escapeHtml(e.description)}</p>` : ''}
        ${people.length ? `<div class="ev-foot"><div class="ev-people">${avatarStackHtml(e.characterIds, 6)}<span>${escapeHtml(people.map((c) => c.name).join('、'))}</span></div></div>` : ''}
      </article>`;
    }

    function renderTimeline(work) {
      const { chapters, events, flashbacks, filtered, allTags, characters } = timelineData(work);
      const tl = ui.timeline;
      const head = pageHeadHtml('時間線', '每個事件同時記錄「故事中真正發生的時間」與「讀者在第幾章讀到」。',
        `<button type="button" class="btn btn-primary" data-action="new-event">${icon('plus')}新增事件</button>`);
      if (!events.length) {
        return head + emptyHtml('timeline', '還沒有事件', '記錄故事中發生的事，墨織會幫你對照故事時間與敘事順序，並自動找出倒敘。',
          `<button type="button" class="btn btn-primary" data-action="new-event">${icon('plus')}新增第一個事件</button>`);
      }
      const modes = [['story', '故事順序', 'list'], ['narrative', '敘事順序', 'book'], ['dual', '雙軸對照圖', 'columns']];
      const toolbar = `<div class="tl-toolbar">
        <div class="tabs" role="tablist">${modes.map(([k, label, ic]) => `<button type="button" role="tab" class="tab${tl.mode === k ? ' active' : ''}" aria-selected="${tl.mode === k}" data-action="tl-mode" data-mode="${k}">${icon(ic)}${label}</button>`).join('')}</div>
        <div class="tl-filters">
          <select class="select" data-action="tl-filter-char" aria-label="依角色篩選"><option value="">所有角色</option>${characters.map((c) => `<option value="${escapeHtml(c.id)}"${tl.charId === c.id ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}</select>
          <select class="select" data-action="tl-filter-tag" aria-label="依標籤篩選"><option value="">所有標籤</option>${allTags.map((t) => `<option value="${escapeHtml(t)}"${tl.tag === t ? ' selected' : ''}>${escapeHtml(t)}</option>`).join('')}</select>
          ${tl.charId || tl.tag ? `<button type="button" class="btn btn-sm btn-ghost" data-action="tl-clear-filters">${icon('x')}清除篩選</button>` : ''}
        </div>
      </div>`;
      if (!filtered.length) return head + toolbar + emptyHtml('search', '沒有符合篩選條件的事件', '試試其他角色或標籤。');

      let body = '';
      if (tl.mode === 'narrative') {
        const groups = chapters.map((c) => ({ c, list: filtered.filter((e) => e.chapterId === c.id).sort((a, b) => a.orderInChapter - b.orderInChapter || byCreated(a, b)) })).filter((x) => x.list.length);
        const bg = sortEventsByStory(filtered.filter((e) => !e.chapterId || !chapters.some((c) => c.id === e.chapterId)));
        const fbCount = filtered.filter((e) => flashbacks.has(e.id)).length;
        body = `<p class="hint" style="margin-bottom:16px">${icon('info')} 依讀者閱讀的順序排列；故事時間比先前章節更早的事件會標示「↩ 倒敘」（目前 ${fbCount} 個）。</p>`
          + groups.map(({ c, list }) => {
            const allInChapter = state.events.filter((e) => e.chapterId === c.id).sort((a, b) => a.orderInChapter - b.orderInChapter || byCreated(a, b));
            return `<section class="chapter-group"><div class="chapter-group-head"><span class="num">第 ${c.order} 章</span><h3>${escapeHtml(c.title)}</h3></div>
              <div class="ev-list">${list.map((e) => eventCardHtml(work, e, chapters, flashbacks, 'narrative', { first: allInChapter[0]?.id === e.id, last: allInChapter[allInChapter.length - 1]?.id === e.id })).join('')}</div></section>`;
          }).join('')
          + (bg.length ? `<section class="chapter-group"><div class="chapter-group-head"><span class="num" style="color:var(--text-muted)">背景事件</span><h3 class="muted" style="font-weight:600">正文未呈現</h3></div>
              <div class="ev-list">${bg.map((e) => eventCardHtml(work, e, chapters, flashbacks, 'narrative')).join('')}</div></section>` : '');
      } else if (tl.mode === 'dual') {
        body = dualChartHtml(work, filtered, chapters, flashbacks);
      } else {
        body = `<ol class="tl">${sortEventsByStory(filtered).map((e) => `
          <li class="tl-item${e.chapterId ? '' : ' is-background'}${flashbacks.has(e.id) ? ' is-flashback' : ''}">
            <div class="tl-time">${escapeHtml(e.storyTimeLabel || '未設定時間')}<span class="tl-sort">#${fmtNum(e.storyTimeSort)}</span></div>
            <div class="tl-dot"></div>
            ${eventCardHtml(work, e, chapters, flashbacks, 'story')}
          </li>`).join('')}</ol>`;
      }
      return head + toolbar + body;
    }

    /** 雙軸對照圖：左欄故事順序、右欄敘事順序，同一事件以線相連 */
    function dualChartHtml(work, events, chapters, flashbacks) {
      const story = sortEventsByStory(events);
      const narrative = sortEventsByNarrative(events, chapters);
      const rowH = 46;
      const top = 54;
      const W = 680;
      const lx = 262;
      const rx = 418;
      const H = top + Math.max(story.length, narrative.length) * rowH + 10;
      const ly = new Map(story.map((e, i) => [e.id, top + i * rowH + rowH / 2]));
      const ry = new Map(narrative.map((e, i) => [e.id, top + i * rowH + rowH / 2]));
      const chOrder = chapterOrderMap(chapters);
      let links = '';
      for (const e of narrative) {
        const y1 = ly.get(e.id);
        const y2 = ry.get(e.id);
        links += `<path class="dual-link${flashbacks.has(e.id) ? ' is-flashback' : ''}" data-dual-id="${escapeHtml(e.id)}" d="M${lx + 8} ${y1} C${(lx + rx) / 2} ${y1} ${(lx + rx) / 2} ${y2} ${rx - 8} ${y2}"/>`;
      }
      const leftItems = story.map((e) => {
        const y = ly.get(e.id);
        const cls = !e.chapterId ? ' is-background' : flashbacks.has(e.id) ? ' is-flashback' : '';
        return `<g class="dual-item" data-dual-id="${escapeHtml(e.id)}" tabindex="0"><title>${escapeHtml(e.title)}</title>
          <text class="dual-title" x="${lx - 16}" y="${y - 3}" text-anchor="end">${escapeHtml(truncateText(e.title, 14))}</text>
          <text class="dual-meta" x="${lx - 16}" y="${y + 13}" text-anchor="end">${escapeHtml(truncateText(e.storyTimeLabel || `#${fmtNum(e.storyTimeSort)}`, 16))}${e.chapterId ? '' : '・背景'}</text>
          <circle class="dual-node${cls}" cx="${lx}" cy="${y}" r="7"/></g>`;
      }).join('');
      const rightItems = narrative.map((e) => {
        const y = ry.get(e.id);
        const fb = flashbacks.has(e.id);
        return `<g class="dual-item" data-dual-id="${escapeHtml(e.id)}" tabindex="0"><title>${escapeHtml(e.title)}</title>
          <circle class="dual-node${fb ? ' is-flashback' : ''}" cx="${rx}" cy="${y}" r="7"/>
          <text class="dual-title" x="${rx + 16}" y="${y - 3}">${escapeHtml(truncateText(e.title, 14))}</text>
          <text class="dual-meta" x="${rx + 16}" y="${y + 13}">第 ${chOrder.get(e.chapterId)} 章${fb ? '・↩ 倒敘' : ''}</text></g>`;
      }).join('');
      return `<div class="dual-wrap">

    function bindDualChart() {
      const svg = document.getElementById('dual-svg');
      if (!svg) return;
      const highlight = (id) => {
        svg.classList.toggle('has-hl', !!id);
        svg.querySelectorAll('[data-dual-id]').forEach((el) => el.classList.toggle('hl', !!id && el.dataset.dualId === id));

      svg.addEventListener('pointerover', (e) => { const el = e.target.closest('[data-dual-id]'); highlight(el ? el.dataset.dualId : null); });
      svg.addEventListener('pointerleave', () => highlight(null));
      svg.addEventListener('focusin', (e) => { const el = e.target.closest('[data-dual-id]'); if (el) highlight(el.dataset.dualId); });

    /** 排序數字的相鄰提示，例：「前一個：30，後一個：40」 */
    function sortNeighborHint(workId, value, excludeId) {
      const others = sortEventsByStory(getEventsByWork(workId).filter((e) => e.id !== excludeId));
      if (!others.length) return '目前沒有其他事件，數字可自由設定（越小越早）。';
      if (!Number.isFinite(value)) return `其他事件的範圍：${fmtNum(others[0].storyTimeSort)} ～ ${fmtNum(others[others.length - 1].storyTimeSort)}`;
      let prev = null;
      let next = null;
      const same = [];
      for (const e of others) {
        if (e.storyTimeSort < value) prev = e;
        else if (e.storyTimeSort === value) same.push(e);
        else if (!next) next = e;
      }
      const fmt = (e) => (e ? `${fmtNum(e.storyTimeSort)}（${truncateText(e.title, 10)}）` : '無');
      let text = `前一個：${fmt(prev)}，後一個：${fmt(next)}`;
      if (same.length) text += `；與「${truncateText(same[0].title, 10)}」相同`;
      return text;
    }

    function readEventForm(fd) {
      const title = str(fd.get('title')).trim();
      if (!title) return { error: '請輸入事件標題' };
      const rawSort = str(fd.get('storyTimeSort')).trim();
      const sort = Number(rawSort);
      if (rawSort === '' || !Number.isFinite(sort)) return { error: '排序數字必須是數字（可用小數插入兩個事件之間）' };
      return { data: {
        title,
        description: str(fd.get('description')).trim(),
        storyTimeLabel: str(fd.get('storyTimeLabel')).trim(),
        storyTimeSort: sort,
        chapterId: str(fd.get('chapterId')) || null,
        characterIds: fd.getAll('characterIds').map(String),
        tags: splitList(fd.get('tags')),
      } };

    // --- 全域搜尋 ---
    function searchWork(workId, query) {
      const q = query.trim().toLowerCase();
      if (!q) return [];
      const has = (...values) => values.some((v) => String(v || '').toLowerCase().includes(q));
      const chapters = getChaptersByWork(workId);
      const groups = [
        { label: '角色', icon: 'user', items: getCharactersByWork(workId).filter((c) => has(c.name, ...c.aliases))
          .map((c) => ({ title: c.name, sub: c.aliases.join('、') || c.tags.join('、'), href: workHref(workId, 'characters', c.id), flash: null, avatar: c })) },
        { label: '章節', icon: 'book', items: chapters.filter((c) => has(c.title, c.summary))
          .map((c) => ({ title: chapterLabel(c), sub: c.summary, href: workHref(workId, 'chapters'), flash: c.id })) },
        { label: '事件', icon: 'timeline', items: sortEventsByStory(getEventsByWork(workId)).filter((e) => has(e.title, e.description))
          .map((e) => ({ title: e.title, sub: [e.storyTimeLabel, e.description].filter(Boolean).join('・'), href: workHref(workId, 'timeline'), flash: e.id })) },
        { label: '伏筆', icon: 'feather', items: getForeshadowsByWork(workId).filter((f) => has(f.title, f.description))
          .map((f) => ({ title: f.title, sub: f.description, href: workHref(workId, 'foreshadows'), flash: f.id })) },
      ];
      return groups.filter((g) => g.items.length).map((g) => ({ ...g, items: g.items.slice(0, 8) }));
    }

    /** 跳到某個項目前，清除會把它藏起來的篩選條件 */
    function prepareFlash(href, tab = null) {
      if (href.endsWith('/timeline')) { ui.timeline.charId = ''; ui.timeline.tag = ''; if (ui.timeline.mode === 'dual') ui.timeline.mode = 'story'; }

    // ===== 9. 路由 =====
    const WORK_PAGES = ['chapters', 'characters', 'relations', 'timeline', 'foreshadows', 'settings'];

    function parseRoute() {
      const raw = location.hash.replace(/^#/, '');
      let parts;
      try { parts = raw.split('/').filter(Boolean).map(decodeURIComponent); } catch (err) { return { name: 'notfound' }; }
      if (!parts.length) return { name: 'works' };
      if (parts[0] !== 'works' || !parts[1]) return { name: 'notfound' };
      const workId = parts[1];
      if (parts.length === 2) return { name: 'overview', workId };
      const page = parts[2];
      if (!WORK_PAGES.includes(page)) return { name: 'notfound', workId };
      if (parts.length === 3) return { name: page, workId };
      if (page === 'characters' && parts.length === 4) return { name: 'character', workId, characterId: parts[3] };
      return { name: 'notfound', workId };
    }

    function buildPage(route) {
      if (route.name === 'works') return { html: renderWorksPage(), title: '' };
      const work = route.workId ? getWork(route.workId) : null;
      if (!work || route.name === 'notfound') return { html: renderNotFound(), title: '找不到頁面' };
      const pages = {
        overview: () => [renderOverview(work), '總覽'],
        chapters: () => [renderChapters(work), '章節'],
        characters: () => [renderCharacters(work), '角色'],
        relations: () => [renderRelations(work), '關係圖'],
        timeline: () => [renderTimeline(work), '時間線'],
        foreshadows: () => [renderForeshadows(work), '伏筆'],
        settings: () => [renderSettings(work), '作品設定'],
      };
      if (route.name === 'character') {
        const c = findById('characters', route.characterId);
        if (!c || c.workId !== work.id) return { html: renderNotFound(), title: '找不到頁面' };
        return { html: shellHtml(work, 'character', renderCharacterDetail(work, c)), title: `${c.name}｜${work.title}` };
      }
      const [inner, title] = pages[route.name]();
      return { html: shellHtml(work, route.name, inner), title: `${title}｜${work.title}` };
    }

    function onRouteChange(route) {
      ui.navOpen = false;
      ui.secretRevealed.clear();
      if (route.workId !== ui.lastWorkId) {
        ui.lastWorkId = route.workId || null;
        ui.charSearch = '';
        ui.charTag = '';
        ui.timeline = { mode: 'story', charId: '', tag: '' };
        ui.fsTab = 'all';
        ui.expandedChapters.clear();
      }
      if (route.name === 'relations' && route.workId) {
        const g = graphState(route.workId);
        g.chapterOrder = null;
        g.showAll = false;
        g.selected = ui.pendingGraphSelect;
        g.drag = null;
        ui.pendingGraphSelect = null;
      }
    }

    function captureFocus(app) {
      const el = document.activeElement;
      if (!el || !el.id || !app.contains(el)) return null;
      let start = null;
      let end = null;
      try { start = el.selectionStart; end = el.selectionEnd; } catch (err) { /* 不支援選取範圍 */ }
      return { id: el.id, start, end };
    }

    function restoreFocus(saved) {
      const el = document.getElementById(saved.id);
      if (!el) return;
      el.focus({ preventScroll: true });
      if (saved.start != null) { try { el.setSelectionRange(saved.start, saved.end); } catch (err) { /* 忽略 */ } }
    }

    function applyFlash() {
      if (!ui.flashId) return;
      const el = document.getElementById(`item-${ui.flashId}`);
      ui.flashId = null;
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1900);
    }

    /** 依目前路由重繪整個畫面 */
    function render() {
      flushAutosave();
      const app = document.getElementById('app');
      if (!ui.ready) { app.innerHTML = ui.loadError ? fatalHtml(ui.loadError) : loadingHtml(); return; }
      const route = parseRoute();
      const routeKey = location.hash || '#/';
      const routeChanged = routeKey !== ui.lastRouteKey;
      if (routeChanged) onRouteChange(route);
      ui.lastRouteKey = routeKey;
      const focus = routeChanged ? null : captureFocus(app);
      const scrollY = window.scrollY;
      const { html, title } = buildPage(route);
      app.innerHTML = html;
      document.title = title ? `${title}｜墨織 InkWeave` : '墨織 InkWeave｜小說設定工坊';
      if (focus) restoreFocus(focus);
      if (route.name === 'relations') bindGraphEvents();
      if (route.name === 'chapters') bindChapterDrag();
      if (route.name === 'timeline') bindDualChart();
      if (routeChanged && !ui.flashId) window.scrollTo(0, 0);
      else if (!routeChanged && window.scrollY !== scrollY) window.scrollTo(0, scrollY);
      applyFlash();
    }

    /** 章節拖曳排序（Pointer Events，滑鼠與觸控皆可） */
    function bindChapterDrag() {
      const list = document.getElementById('chapter-list');
      if (!list) return;
      list.addEventListener('pointerdown', (e) => {
        const handle = e.target.closest('[data-drag-handle]');
        if (!handle || (e.pointerType === 'mouse' && e.button !== 0)) return;
        const item = handle.closest('.chapter-item');
        const items = [...list.children];
        if (items.length < 2) return;
        const from = items.indexOf(item);
        const rects = items.map((el) => el.getBoundingClientRect());
        const gap = rects[1].top - rects[0].bottom;
        const shift = rects[from].height + gap;
        const startY = e.clientY;
        let to = from;
        e.preventDefault();
        try { handle.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
        item.classList.add('dragging');
        list.classList.add('is-sorting');
        const onMove = (ev) => {
          const dy = ev.clientY - startY;
          item.style.transform = `translateY(${dy}px)`;
          const center = rects[from].top + rects[from].height / 2 + dy;
          to = 0;
          rects.forEach((r, i) => { if (i !== from && center > r.top + r.height / 2) to++; });
          items.forEach((el, i) => {
            if (i === from) return;
            let s = 0;
            if (from < to && i > from && i <= to) s = -shift;
            if (from > to && i >= to && i < from) s = shift;
            el.style.transform = s ? `translateY(${s}px)` : '';
          });
        };
        const onEnd = (ev) => {
          handle.removeEventListener('pointermove', onMove);
          handle.removeEventListener('pointerup', onEnd);
          handle.removeEventListener('pointercancel', onEnd);
          items.forEach((el) => { el.style.transform = ''; });
          item.classList.remove('dragging');
          list.classList.remove('is-sorting');
          if (ev.type === 'pointerup' && to !== from) {
            const ids = items.map((el) => el.dataset.chapterId);
            const [moved] = ids.splice(from, 1);
            ids.splice(to, 0, moved);
            reorderChapters(list.dataset.workId, ids).then(() => toast('已更新章節順序', 'success')).catch(handleError);
          }
        };
        handle.addEventListener('pointermove', onMove);
        handle.addEventListener('pointerup', onEnd);
        handle.addEventListener('pointercancel', onEnd);
      });
    }

    async function confirmAndDeleteCharacter(charId) {
      const c = findById('characters', charId);
      const { impact } = planCharacterRemoval(charId);
      const effects = [];
      if (impact.relations) effects.push(`同時移除 <strong>${impact.relations}</strong> 條關係`);
      const from = [impact.events && `<strong>${impact.events}</strong> 個事件`, impact.foreshadows && `<strong>${impact.foreshadows}</strong> 個伏筆`].filter(Boolean);
      if (from.length) effects.push(`從 ${from.join('、')}中移除`);
      if (c.avatarImageId) effects.push('刪除頭像圖片');
      const ok = await confirmDialog({
        title: '刪除角色',
        message: `確定要刪除「<strong>${escapeHtml(c.name)}</strong>」嗎？此操作無法復原。<br>${effects.length ? `刪除此角色將${effects.join('，')}。` : '此角色沒有其他關聯資料。'}`,
        confirmText: '刪除角色',
        danger: true,
      });
      if (!ok) return;
      const workId = c.workId;
      await removeCharacter(charId, { render: false });
      toast(`已刪除角色「${c.name}」`, 'success');
      navigate(workHref(workId, 'characters'));

    async function openPhaseDialog(relId, phaseId = null) {
      const rel = findById('relationships', relId);
      const chapters = getChaptersByWork(rel.workId);
      const existing = phaseId ? rel.phases.find((p) => p.id === phaseId) : null;
      const ctx = currentGraphContext();
      const defaultStart = chapters.find((c) => c.order === (ctx?.order || 0))?.id || null;
      const phase = existing || { type: 'friend', startChapterId: defaultStart, label: '', note: '' };
      const data = await openModal({
        title: existing ? '編輯關係階段' : '新增關係階段',
        body: phaseFieldsHtml(chapters, phase) + '<p class="hint">選擇「關係結束」代表從該章起這條關係不再顯示。</p>',
        submitText: existing ? '儲存' : '新增階段',
        onSubmit: (fd) => {
          const p = readPhaseForm(fd);
          if (rel.phases.some((x) => x.id !== phaseId && (x.startChapterId || null) === p.startChapterId)) return { error: '這條關係已有從同一章開始的階段，請改選其他章節' };
          return p;
        },
      });
      if (!data) return;
      if (existing) await updatePhase(relId, phaseId, data);
      else await addPhase(relId, data);
      toast(existing ? '已更新關係階段' : '已新增關係階段', 'success');
    }

    async function openEventDialog(workId, eventId = null) {
      const existing = eventId ? findById('events', eventId) : null;
      const events = getEventsByWork(workId);
      const ev = existing || {
        title: '', description: '', storyTimeLabel: '', characterIds: [], tags: [], chapterId: null,
        storyTimeSort: events.length ? Math.max(...events.map((e) => e.storyTimeSort)) + 10 : 10,
      };
      if (!existing) {
        const work = getWork(workId);
        const chapters = getChaptersByWork(workId);
        ev.chapterId = chapters.find((c) => c.order === getCurrentOrder(work, chapters))?.id || null;
      }
      const updateHint = (modal) => {
        const input = modal.querySelector('#f-tsort');
        const hint = modal.querySelector('#sort-hint');
        if (input && hint) hint.textContent = sortNeighborHint(workId, input.value === '' ? NaN : Number(input.value), eventId);
      };
      const data = await openModal({
        title: existing ? '編輯事件' : '新增事件',
        body: eventFormHtml(getWork(workId), ev),
        submitText: existing ? '儲存' : '新增事件',
        wide: true,
        onOpen: updateHint,
        onInput: (e) => { if (e.target.id === 'f-tsort') updateHint(document.getElementById('modal')); },
        onSubmit: (fd) => { const r = readEventForm(fd); return r.error ? r : r.data; },
      });
      if (!data) return;
      if (existing) await updateEvent(eventId, data);
      else await createEvent(workId, data);
      toast(existing ? '已更新事件' : '已新增事件', 'success');
    }

    async function openForeshadowDialog(workId, id = null) {
      const existing = id ? findById('foreshadows', id) : null;
      const work = getWork(workId);

        const n = Number(el.value);
        if (!Number.isInteger(n) || n < 1 || n > 999) {
          toast('逾期門檻必須是 1～999 的整數', 'error');
          el.value = work.foreshadowWarnThreshold;
          return;
        }
        if (n === work.foreshadowWarnThreshold) return;
        await updateWork(work.id, { foreshadowWarnThreshold: n });
        toast(`逾期門檻已設為 ${n} 章`, 'success');
      },
      'avatar-file': async (el) => {
        const file = el.files?.[0];
        el.value = '';
        if (!file) return;
        const id = detailCharId();
        setSaveStatus('saving', '處理圖片中…');
        try {
          const dataUrl = await compressImage(file);
          await setCharacterAvatar(id, dataUrl);
          toast('頭像已更新', 'success');
        } catch (err) {
          setSaveStatus('error', '頭像未更新');
          handleError(err);
        }
      },
      'char-field': (el) => {
        if (el.dataset.field !== 'name' || el.value.trim()) return;
        flushAutosave();
        const c = findById('characters', detailCharId());
        if (c) el.value = c.name;
        setSaveStatus('idle', '姓名不可空白，已還原');
      },
      'chip-entry': (el) => addChipsFromEntry(el),
      'graph-show-all': (el) => { ui.graph.showAll = el.checked; render(); },
      'tl-filter-char': (el) => { ui.timeline.charId = el.value; render(); },
      'tl-filter-tag': (el) => { ui.timeline.tag = el.value; render(); },
    };

    function runAction(fn, el, e) {
      try {
        const ret = fn(el, e);
        if (ret && typeof ret.catch === 'function') ret.catch(handleError);
      } catch (err) {
        handleError(err);
      }
    }

    function bindGlobalEvents() {
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el) return;
        const fn = clickActions[el.dataset.action];
        if (!fn || el.disabled) return;
        e.preventDefault();
        if (el.dataset.action !== 'chip-remove' && el.dataset.action !== 'remove-custom-field') flushAutosave();
        runAction(fn, el, e);
      });
      document.addEventListener('input', (e) => {
        const el = e.target;
        if (modalState && el.closest && el.closest('#modal')) { if (modalState.onInput) modalState.onInput(e); return; }
        const fn = inputActions[el.dataset?.action];
        if (fn) runAction(fn, el, e);
      });
      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.closest && el.closest('#modal')) return;
        const fn = changeActions[el.dataset?.action];
        if (fn) runAction(fn, el, e);
      });
      document.addEventListener('submit', (e) => {
        if (!e.target.matches('[data-modal-form]')) return;
        e.preventDefault();
        handleModalSubmit(e.target);
      });
      document.addEventListener('keydown', (e) => {
        const el = e.target;
        if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'k') {
          const route = parseRoute();
          if (route.workId && getWork(route.workId)) { e.preventDefault(); openSearch(); }
          return;
        }
        if (el.id === 'search-input' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          e.preventDefault();
          setSearchActive(ui.search.active + (e.key === 'ArrowDown' ? 1 : -1));
          return;
        }
        if (el.dataset?.action === 'chip-entry') {
          if (e.isComposing || e.keyCode === 229) return;
          if (e.key === 'Enter') { e.preventDefault(); addChipsFromEntry(el); }
          else if (e.key === 'Backspace' && !el.value) {
            const chips = el.closest('[data-chip-field]').querySelectorAll('.chip');
            if (chips.length) chips[chips.length - 1].querySelector('button').click();
          }
          return;
        }
        if ((e.key === 'Enter' || e.key === ' ') && el.dataset?.action === 'span-jump') { e.preventDefault(); runAction(clickActions['span-jump'], el, e); return; }
        if (e.key === 'Escape' && ui.navOpen) clickActions['close-nav']();
      });
      const modal = document.getElementById('modal');
      modal.addEventListener('close', () => {
        // 以 Esc 關閉時也要結束 Promise（若已開啟新的對話框則不處理）
        if (!modal.open && modalState) { const current = modalState; modalState = null; current.resolve(null); }
      });
      window.addEventListener('hashchange', render);
      try {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (ui.theme === 'system') applyTheme(); });
      } catch (err) { /* 舊瀏覽器不支援 */ }
      window.addEventListener('beforeunload', () => flushAutosave());
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAutosave(); });
    }

    // ===== 11. 啟動（init） =====
    async function init() {
      ui.theme = getThemePref();
      applyTheme();
      bindGlobalEvents();
      render();
      try {
        await dbOpen();
        await loadState();
        ui.ready = true;
      } catch (err) {
        console.error('[墨織] 無法載入資料', err);
        ui.loadError = err?.message || String(err);
      }
      if (navigator.storage && typeof navigator.storage.persist === 'function') {
        navigator.storage.persist().catch(() => {});
      }
      render();
      if (new URLSearchParams(location.search).has('selftest')) runSelfTest();
    }

    init();
  </script>
</body>
</html>
