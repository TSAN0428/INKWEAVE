    // ===== 3. IndexedDB 底層存取 =====
    let dbPromise = null;

    function dbOpen() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') { reject(new Error('此瀏覽器不支援 IndexedDB')); return; }
        let req;
        try { req = indexedDB.open(DB_NAME, DB_VERSION); } catch (err) { reject(err); return; }
        req.onupgradeneeded = () => {
          const db = req.result;
          for (const name of STORES) {
            if (db.objectStoreNames.contains(name)) continue;
            const store = db.createObjectStore(name, { keyPath: 'id' });
            if (name !== 'works') store.createIndex('workId', 'workId', { unique: false });
          }
        };
        req.onsuccess = () => {
          const db = req.result;
          db.onversionchange = () => db.close();
          resolve(db);
        };
        req.onerror = () => reject(req.error || new Error('無法開啟資料庫'));
        req.onblocked = () => reject(new Error('資料庫正被其他分頁使用，請關閉其他墨織分頁後重新整理'));
      });
      dbPromise.catch(() => { dbPromise = null; });
      return dbPromise;
    }

    function requestToPromise(req) {
      return new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAll(store) {
      const db = await dbOpen();
      return requestToPromise(db.transaction(store, 'readonly').objectStore(store).getAll());
    }

    function dbPut(store, obj) {
      return dbTx([store], (tx) => { tx.objectStore(store).put(obj); });
    }

    function dbDelete(store, id) {
      return dbTx([store], (tx) => { tx.objectStore(store).delete(id); });
    }

    /**
     * 在單一 readwrite transaction 中執行多表操作。
     * fn 需同步排入所有請求；任何錯誤都會 abort 整個 transaction（不留下部分寫入）。
     */
    async function dbTx(storeNames, fn) {
      const db = await dbOpen();
      return new Promise((resolve, reject) => {
        let tx;
        try { tx = db.transaction(storeNames, 'readwrite'); } catch (err) { reject(err); return; }
        let settled = false;
        const fail = (err) => { if (!settled) { settled = true; reject(err || new Error('資料庫交易失敗')); } };
        tx.oncomplete = () => { if (!settled) { settled = true; resolve(); } };
        tx.onerror = () => fail(tx.error);
        tx.onabort = () => fail(tx.error || new Error('資料庫交易已取消'));
        try {
          const ret = fn(tx);
          if (ret && typeof ret.then === 'function') {
            ret.catch((err) => { try { tx.abort(); } catch (e) { /* 已結束 */ } fail(err); });
          }
        } catch (err) {
          try { tx.abort(); } catch (e) { /* 已結束 */ }
          fail(err);
        }
      });
    }

    // ===== 4. 資料層（state 與 create/update/remove） =====
    /**
     * @typedef {Object} Work 作品
     * @property {string} id
     * @property {string} title
     * @property {string} description
     * @property {string|null} currentChapterId   null = 視為最後一章
     * @property {number} foreshadowWarnThreshold 預設 10
     * @property {string} createdAt               ISO 8601
     * @property {string} updatedAt
     */
    /**
     * @typedef {Object} Chapter 章節
     * @property {string} id
     * @property {string} workId
     * @property {number} order      1, 2, 3…（正規化後連續）
     * @property {string} title
     * @property {string} summary
     * @property {string} createdAt
     * @property {string} updatedAt
     */
    /**
     * @typedef {Object} Character 角色
     * @property {string} id
     * @property {string} workId
     * @property {string} name
     * @property {string[]} aliases
     * @property {string|null} avatarImageId
     * @property {string} color                   '#RRGGBB'
     * @property {string[]} tags
     * @property {string} appearance
     * @property {string} personality
     * @property {string} catchphrase
     * @property {string} motivation
     * @property {string} secret
     * @property {{id:string, key:string, value:string}[]} customFields
     * @property {string} notes
     * @property {{x:number, y:number}|null} graphPosition
     * @property {string} createdAt
     * @property {string} updatedAt
     */
    /**
     * @typedef {Object} StoredImage 圖片
     * @property {string} id
     * @property {string} workId
     * @property {string} dataUrl     壓縮後的 data URL
     * @property {string} createdAt
     */
    /**
     * @typedef {'family'|'romance'|'crush'|'friend'|'ally'|'rival'|'enemy'|'mentor'|'subordinate'|'other'|'ended'} RelationType
     */
    /**
     * @typedef {Object} RelationPhase 關係階段
     * @property {string} id
     * @property {string|null} startChapterId   null = 從故事開始
     * @property {RelationType} type
     * @property {string} label                  線上顯示文字，例：「青梅竹馬」
     * @property {string} note
     */
    /**
     * @typedef {Object} Relationship 關係
     * @property {string} id
     * @property {string} workId
     * @property {string} sourceId      Character.id
     * @property {string} targetId      Character.id
     * @property {boolean} directed     true = source → target 單向
     * @property {RelationPhase[]} phases  至少 1 筆
     * @property {string} createdAt
     * @property {string} updatedAt
     */
    /**
     * @typedef {Object} TimelineEvent 時間線事件
     * @property {string} id
     * @property {string} workId
     * @property {string} title
     * @property {string} description
     * @property {string} storyTimeLabel
     * @property {number} storyTimeSort
     * @property {string|null} chapterId   null = 背景事件
     * @property {number} orderInChapter   同章內排序，從 1 起
     * @property {string[]} characterIds
     * @property {string[]} tags
     * @property {string} createdAt
     * @property {string} updatedAt
     */
    /**
     * @typedef {Object} Foreshadow 伏筆
     * @property {string} id
     * @property {string} workId
     * @property {string} title
     * @property {string} description
     * @property {string} plantedChapterId
     * @property {string|null} plannedPayoffChapterId
     * @property {string|null} payoffChapterId  status = 'resolved' 時必填
     * @property {'open'|'resolved'|'abandoned'} status
     * @property {string[]} characterIds
     * @property {string[]} eventIds
     * @property {string} payoffNote
     * @property {string} createdAt
     * @property {string} updatedAt
     */

    /** 記憶體中的資料（畫面一律從這裡讀取） */
    const state = { works: [], chapters: [], characters: [], images: [], relationships: [], events: [], foreshadows: [] };

    async function loadState() {
      const results = await Promise.all(STORES.map((name) => dbGetAll(name)));
      STORES.forEach((name, i) => { state[name] = results[i]; });
    }

    const putOp = (store, value) => ({ type: 'put', store, value });
    const delOp = (store, id) => ({ type: 'delete', store, id });

    function applyOps(ops) {
      for (const op of ops) {
        const list = state[op.store];
        const id = op.type === 'put' ? op.value.id : op.id;
        const idx = list.findIndex((x) => x.id === id);
        if (op.type === 'put') {
          if (idx >= 0) list[idx] = op.value; else list.push(op.value);
        } else if (idx >= 0) {
          list.splice(idx, 1);
        }
      }
    }

    /**
     * 所有寫入的唯一入口：先更新 state（並重繪），再以單一 transaction 寫入 IndexedDB。
     * 寫入失敗時重新從 IndexedDB 載入 state，確保畫面與資料庫一致。
     */
    async function commit(ops, { render: shouldRender = true } = {}) {
      ops = ops.filter(Boolean);
      if (!ops.length) return;
      applyOps(ops);
      if (shouldRender) render();
      try {
        await dbTx(uniq(ops.map((op) => op.store)), (tx) => {
          for (const op of ops) {
            const store = tx.objectStore(op.store);
            if (op.type === 'put') store.put(op.value); else store.delete(op.id);
          }
        });
      } catch (err) {
        console.error('[墨織] 寫入失敗', err);
        try { await loadState(); } catch (e) { console.error(e); }
        render();
        toast(`儲存失敗，已還原為上次儲存的資料（${err?.message || err}）`, 'error');
        if (err && typeof err === 'object') err.handled = true;
        throw err;
      }
    }

    // --- 查詢 ---
    function findById(store, id) { return id ? state[store].find((x) => x.id === id) || null : null; }
    const getWork = (id) => findById('works', id);
    const getImageUrl = (id) => findById('images', id)?.dataUrl || null;
    const byCreated = (a, b) => String(a.createdAt).localeCompare(String(b.createdAt));
    function getChaptersByWork(workId) { return state.chapters.filter((c) => c.workId === workId).sort((a, b) => a.order - b.order); }
    function getCharactersByWork(workId) { return state.characters.filter((c) => c.workId === workId).sort(byCreated); }
    function getRelationshipsByWork(workId) { return state.relationships.filter((r) => r.workId === workId).sort(byCreated); }
    function getEventsByWork(workId) { return state.events.filter((e) => e.workId === workId); }
    function getForeshadowsByWork(workId) { return state.foreshadows.filter((f) => f.workId === workId).sort(byCreated); }

    function touchWorkOp(workId, time) {
      const work = getWork(workId);
      return work ? putOp('works', { ...work, updatedAt: time }) : null;
    }

    /** 通用更新：自動填入 updatedAt 並同步作品的 updatedAt */
    async function updateEntity(store, id, patch, opts) {
      const old = findById(store, id);
      if (!old) throw new Error('找不到要更新的資料');
      const t = nowIso();
      const value = { ...old, ...patch, id: old.id, updatedAt: t };
      const ops = [putOp(store, value)];
      if (store !== 'works') ops.push(touchWorkOp(old.workId, t));
      await commit(ops, opts);
      return value;
    }

    /** 通用新增：自動填入 createdAt / updatedAt 並同步作品的 updatedAt */
    async function createEntity(store, value, opts) {
      const t = nowIso();
      const full = { ...value, createdAt: t, updatedAt: t };
      const ops = [putOp(store, full)];
      if (store !== 'works') ops.push(touchWorkOp(full.workId, t));
      await commit(ops, opts);
      return full;
    }

    // --- 作品 ---
    function createWork(input, opts) {
      return createEntity('works', {
        id: uuid(),
        title: input.title.trim(),
        description: (input.description || '').trim(),
        currentChapterId: null,
        foreshadowWarnThreshold: DEFAULT_WARN_THRESHOLD,
      }, opts);
    }
    const updateWork = (id, patch, opts) => updateEntity('works', id, patch, opts);

    function getWorkCounts(workId) {
      const count = (store) => state[store].filter((x) => x.workId === workId).length;
      return { chapters: count('chapters'), characters: count('characters'), images: count('images'), relationships: count('relationships'), events: count('events'), foreshadows: count('foreshadows') };
    }

    async function removeWork(workId, opts) {
      const ops = [delOp('works', workId)];
      for (const store of STORES) {
        if (store === 'works') continue;
        state[store].filter((x) => x.workId === workId).forEach((x) => ops.push(delOp(store, x.id)));
      }
      await commit(ops, opts);
    }

    // --- 章節 ---
    function createChapter(workId, input, opts) {
      const chapters = getChaptersByWork(workId);
      return createEntity('chapters', {
        id: uuid(),
        workId,
        order: chapters.length + 1,
        title: input.title.trim(),
        summary: (input.summary || '').trim(),
      }, opts);
    }
    const updateChapter = (id, patch, opts) => updateEntity('chapters', id, patch, opts);

    /** 計算刪除章節的連動處理（第 6 節），回傳 ops 與影響統計；有伏筆埋在此章時 blockedBy 不為空 */
    function planChapterRemoval(chapterId) {
      const chapter = findById('chapters', chapterId);
      const workId = chapter.workId;
      const chapters = getChaptersByWork(workId);
      const idx = chapters.findIndex((c) => c.id === chapterId);
      const next = chapters[idx + 1] || null;
      const t = nowIso();
      const impact = { blockedBy: [], events: 0, phasesMoved: 0, phasesRemoved: 0, relationsRemoved: 0, foreshadowsCleared: 0, foreshadowsReopened: 0, wasCurrent: false };
      impact.blockedBy = getForeshadowsByWork(workId).filter((f) => f.plantedChapterId === chapterId);
      const ops = [delOp('chapters', chapterId)];

      for (const ev of getEventsByWork(workId)) {
        if (ev.chapterId !== chapterId) continue;
        impact.events++;
        ops.push(putOp('events', { ...ev, chapterId: null, updatedAt: t }));
      }
      for (const rel of getRelationshipsByWork(workId)) {
        if (!rel.phases.some((p) => p.startChapterId === chapterId)) continue;
        const phases = [];
        for (const ph of rel.phases) {
          if (ph.startChapterId !== chapterId) { phases.push(ph); continue; }
          if (next) { phases.push({ ...ph, startChapterId: next.id }); impact.phasesMoved++; } else { impact.phasesRemoved++; }
        }
        if (phases.length) ops.push(putOp('relationships', { ...rel, phases, updatedAt: t }));
        else { ops.push(delOp('relationships', rel.id)); impact.relationsRemoved++; }
      }
      for (const f of getForeshadowsByWork(workId)) {
        if (f.plannedPayoffChapterId !== chapterId && f.payoffChapterId !== chapterId) continue;
        const patch = { updatedAt: t };
        if (f.plannedPayoffChapterId === chapterId) patch.plannedPayoffChapterId = null;
        if (f.payoffChapterId === chapterId) {
          patch.payoffChapterId = null;
          if (f.status === 'resolved') { patch.status = 'open'; impact.foreshadowsReopened++; }
        }
        impact.foreshadowsCleared++;
        ops.push(putOp('foreshadows', { ...f, ...patch }));
      }
      const work = getWork(workId);
      const workPatch = { updatedAt: t };
      if (work.currentChapterId === chapterId) { workPatch.currentChapterId = null; impact.wasCurrent = true; }
      ops.push(putOp('works', { ...work, ...workPatch }));
      chapters.filter((c) => c.id !== chapterId).forEach((c, i) => {
        if (c.order !== i + 1) ops.push(putOp('chapters', { ...c, order: i + 1, updatedAt: t }));
      });
      return { ops, impact };
    }

    async function removeChapter(chapterId, opts) {
      const { ops, impact } = planChapterRemoval(chapterId);
      if (impact.blockedBy.length) throw new Error('此章節埋有伏筆，無法刪除');
      await commit(ops, opts);
    }

    /** 依指定順序重新正規化章節 order 為 1, 2, 3… */
    async function reorderChapters(workId, orderedIds, opts) {
      const t = nowIso();
      const ops = [];
      orderedIds.forEach((id, i) => {
        const c = findById('chapters', id);
        if (c && c.order !== i + 1) ops.push(putOp('chapters', { ...c, order: i + 1, updatedAt: t }));
      });
      if (!ops.length) return;
      ops.push(touchWorkOp(workId, t));
      await commit(ops, opts);
    }

    async function moveChapter(chapterId, delta) {
      const chapter = findById('chapters', chapterId);
      const ids = getChaptersByWork(chapter.workId).map((c) => c.id);
      const i = ids.indexOf(chapterId);
      const j = i + delta;
      if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      await reorderChapters(chapter.workId, ids);
    }

    // --- 角色 ---
    function createCharacter(workId, input, opts) {
      const count = state.characters.filter((c) => c.workId === workId).length;
      return createEntity('characters', {
        id: uuid(),
        workId,
        name: input.name.trim(),
        aliases: [],
        avatarImageId: null,
        color: CHARACTER_COLORS[count % CHARACTER_COLORS.length],
        tags: [],
        appearance: '',
        personality: '',
        catchphrase: '',
        motivation: '',
        secret: '',
        customFields: [],
        notes: '',
        graphPosition: null,
      }, opts);
    }
    const updateCharacter = (id, patch, opts) => updateEntity('characters', id, patch, opts);

    function planCharacterRemoval(characterId) {
      const ch = findById('characters', characterId);
      const t = nowIso();
      const ops = [delOp('characters', characterId)];
      const rels = getRelationshipsByWork(ch.workId).filter((r) => r.sourceId === characterId || r.targetId === characterId);
      rels.forEach((r) => ops.push(delOp('relationships', r.id)));
      const evs = getEventsByWork(ch.workId).filter((e) => e.characterIds.includes(characterId));
      evs.forEach((e) => ops.push(putOp('events', { ...e, characterIds: e.characterIds.filter((id) => id !== characterId), updatedAt: t })));
      const fss = getForeshadowsByWork(ch.workId).filter((f) => f.characterIds.includes(characterId));
      fss.forEach((f) => ops.push(putOp('foreshadows', { ...f, characterIds: f.characterIds.filter((id) => id !== characterId), updatedAt: t })));
      if (ch.avatarImageId) ops.push(delOp('images', ch.avatarImageId));
      ops.push(touchWorkOp(ch.workId, t));
      return { ops, impact: { relations: rels.length, events: evs.length, foreshadows: fss.length } };
    }

    async function removeCharacter(characterId, opts) {
      await commit(planCharacterRemoval(characterId).ops, opts);
    }

    /** 設定頭像：新增圖片紀錄、更新角色，並刪除舊圖片（同一個 transaction） */
    async function setCharacterAvatar(characterId, dataUrl, opts) {
      const ch = findById('characters', characterId);
      const t = nowIso();
      const img = { id: uuid(), workId: ch.workId, dataUrl, createdAt: t };
      const ops = [putOp('images', img), putOp('characters', { ...ch, avatarImageId: img.id, updatedAt: t })];
      if (ch.avatarImageId) ops.push(delOp('images', ch.avatarImageId));
      ops.push(touchWorkOp(ch.workId, t));
      await commit(ops, opts);
    }

    async function removeCharacterAvatar(characterId, opts) {
      const ch = findById('characters', characterId);
      if (!ch.avatarImageId) return;
      const t = nowIso();
      await commit([
        putOp('characters', { ...ch, avatarImageId: null, updatedAt: t }),
        delOp('images', ch.avatarImageId),
        touchWorkOp(ch.workId, t),
      ], opts);
    }

    /** 一次儲存多個角色在關係圖上的位置 */
    async function saveGraphPositions(workId, positions, opts) {
      const t = nowIso();
      const ops = [];
      for (const [id, pos] of positions) {
        const c = findById('characters', id);
        if (!c) continue;
        const next = { x: Math.round(pos.x), y: Math.round(pos.y) };
        if (c.graphPosition && c.graphPosition.x === next.x && c.graphPosition.y === next.y) continue;
        ops.push(putOp('characters', { ...c, graphPosition: next, updatedAt: t }));
      }
      if (!ops.length) return;
      ops.push(touchWorkOp(workId, t));
      await commit(ops, opts);
    }

    // --- 關係與階段 ---
    function createRelationship(workId, input, opts) {
      return createEntity('relationships', {
        id: uuid(),
        workId,
        sourceId: input.sourceId,
        targetId: input.targetId,
        directed: !!input.directed,
        phases: [{ id: uuid(), ...input.phase }],
      }, opts);
    }
    const updateRelationship = (id, patch, opts) => updateEntity('relationships', id, patch, opts);

    async function removeRelationship(relationshipId, opts) {
      const rel = findById('relationships', relationshipId);
      await commit([delOp('relationships', relationshipId), touchWorkOp(rel.workId, nowIso())], opts);
    }

    function addPhase(relationshipId, phase, opts) {
      const rel = findById('relationships', relationshipId);
      return updateRelationship(relationshipId, { phases: [...rel.phases, { id: uuid(), ...phase }] }, opts);
    }

    function updatePhase(relationshipId, phaseId, patch, opts) {
      const rel = findById('relationships', relationshipId);
      return updateRelationship(relationshipId, { phases: rel.phases.map((p) => (p.id === phaseId ? { ...p, ...patch, id: p.id } : p)) }, opts);
    }

    /** 刪除階段；若為最後一個階段，連同整條關係刪除 */
    async function removePhase(relationshipId, phaseId, opts) {
      const rel = findById('relationships', relationshipId);
      const phases = rel.phases.filter((p) => p.id !== phaseId);
      if (!phases.length) return removeRelationship(relationshipId, opts);
      return updateRelationship(relationshipId, { phases }, opts);
    }

    // --- 時間線事件 ---
    function nextOrderInChapter(chapterId, excludeId = null) {
      if (!chapterId) return 1;
      const orders = state.events.filter((e) => e.chapterId === chapterId && e.id !== excludeId).map((e) => e.orderInChapter);
      return orders.length ? Math.max(...orders) + 1 : 1;
    }

    function createEvent(workId, input, opts) {
      return createEntity('events', {
        id: uuid(),
        workId,
        title: input.title,
        description: input.description,
        storyTimeLabel: input.storyTimeLabel,
        storyTimeSort: input.storyTimeSort,
        chapterId: input.chapterId,
        orderInChapter: nextOrderInChapter(input.chapterId),
        characterIds: input.characterIds,
        tags: input.tags,
      }, opts);
    }

    function updateEvent(id, patch, opts) {
      const old = findById('events', id);
      const next = { ...patch };
      if ('chapterId' in patch && patch.chapterId !== old.chapterId) next.orderInChapter = nextOrderInChapter(patch.chapterId, id);
      return updateEntity('events', id, next, opts);
    }

    function planEventRemoval(eventId) {
      const ev = findById('events', eventId);
      const t = nowIso();
      const fss = getForeshadowsByWork(ev.workId).filter((f) => f.eventIds.includes(eventId));
      const ops = [delOp('events', eventId), touchWorkOp(ev.workId, t)];
      fss.forEach((f) => ops.push(putOp('foreshadows', { ...f, eventIds: f.eventIds.filter((id) => id !== eventId), updatedAt: t })));
      return { ops, impact: { foreshadows: fss.length } };
    }

    async function removeEvent(eventId, opts) {
      await commit(planEventRemoval(eventId).ops, opts);
    }

    /** 在同一章內上移／下移事件，並將 orderInChapter 重新編為 1, 2, 3… */
    async function moveEventInChapter(eventId, delta) {
      const ev = findById('events', eventId);
      if (!ev.chapterId) return;
      const list = state.events.filter((e) => e.chapterId === ev.chapterId).sort((a, b) => a.orderInChapter - b.orderInChapter || byCreated(a, b));
      const i = list.findIndex((e) => e.id === eventId);
      const j = i + delta;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      const t = nowIso();
      const ops = [];
      list.forEach((e, k) => { if (e.orderInChapter !== k + 1) ops.push(putOp('events', { ...e, orderInChapter: k + 1, updatedAt: t })); });
      ops.push(touchWorkOp(ev.workId, t));
      await commit(ops);
    }

    // --- 伏筆 ---
    function createForeshadow(workId, input, opts) {
      return createEntity('foreshadows', { id: uuid(), workId, ...input }, opts);
    }
    const updateForeshadow = (id, patch, opts) => updateEntity('foreshadows', id, patch, opts);
    async function removeForeshadow(id, opts) {
      const f = findById('foreshadows', id);
      await commit([delOp('foreshadows', id), touchWorkOp(f.workId, nowIso())], opts);
    }

    // ===== 5. 計算邏輯（第 7 節） =====
    function chapterOrderMap(chapters) { return new Map(chapters.map((c) => [c.id, c.order])); }

    /** 依起始章節排序階段（startChapterId = null 視為 order 0；同章維持原順序） */
    function sortPhases(relationship, chapters) {
      const orders = chapterOrderMap(chapters);
      return relationship.phases
        .map((phase, index) => ({ phase, index, order: phase.startChapterId == null ? 0 : (orders.get(phase.startChapterId) ?? Infinity) }))
        .sort((a, b) => a.order - b.order || a.index - b.index);
    }

    /** 7.1 某章節時的關係狀態：取「起始 order ≤ chapterOrder」的最後一個階段；尚未開始或已結束回傳 null */
    function getActivePhase(relationship, chapterOrder, chapters) {
      let active = null;
      for (const item of sortPhases(relationship, chapters)) {
        if (item.order <= chapterOrder) active = item.phase; else break;
      }
      if (!active || active.type === 'ended') return null;
      return active;
    }

    /** 最新階段（「顯示全部」時使用）；若最新階段為 ended 則回傳 null */
    function getLatestPhase(relationship, chapters) {
      const sorted = sortPhases(relationship, chapters);
      const last = sorted.length ? sorted[sorted.length - 1].phase : null;
      return last && last.type !== 'ended' ? last : null;
    }

    /** 7.2 倒敘判斷：依敘事順序，storyTimeSort 小於目前為止最大值者為倒敘；背景事件不參與 */
    function markFlashbacks(eventsInNarrativeOrder) {
      const flagged = new Set();
      let max = -Infinity;
      for (const ev of eventsInNarrativeOrder) {
        if (ev.chapterId == null) continue;
        const v = Number(ev.storyTimeSort);
        if (v < max) flagged.add(ev.id); else max = v;
      }
      return flagged;
    }

    function sortEventsByStory(events) {
      return [...events].sort((a, b) => a.storyTimeSort - b.storyTimeSort || byCreated(a, b));
    }

    /** 依章節 order → orderInChapter 排序（只含有章節的事件） */
    function sortEventsByNarrative(events, chapters) {
      const orders = chapterOrderMap(chapters);
      return events
        .filter((e) => e.chapterId != null && orders.has(e.chapterId))
        .sort((a, b) => orders.get(a.chapterId) - orders.get(b.chapterId) || a.orderInChapter - b.orderInChapter || byCreated(a, b));
    }

    /** 目前章節的 order（未設定則為最大 order；沒有章節為 0） */
    function getCurrentOrder(work, chapters) {
      if (!chapters.length) return 0;
      const current = work.currentChapterId ? chapters.find((c) => c.id === work.currentChapterId) : null;
      return current ? current.order : Math.max(...chapters.map((c) => c.order));
    }

    /** 7.3 已埋章數 = current − planted.order */
    function chaptersSincePlanted(foreshadow, work, chapters) {
      const planted = chapters.find((c) => c.id === foreshadow.plantedChapterId);
      return planted ? getCurrentOrder(work, chapters) - planted.order : 0;
    }

    /** 7.3 伏筆逾期：未回收，且超過門檻或已超過預計回收章 */
    function isOverdue(foreshadow, work, chapters) {
      if (foreshadow.status !== 'open') return false;
      const current = getCurrentOrder(work, chapters);
      const planted = chapters.find((c) => c.id === foreshadow.plantedChapterId);
      if (planted && current - planted.order >= work.foreshadowWarnThreshold) return true;
      if (foreshadow.plannedPayoffChapterId) {
        const planned = chapters.find((c) => c.id === foreshadow.plannedPayoffChapterId);
        if (planned && current > planned.order) return true;
      }
      return false;
    }

    /** 7.4 角色出場章節：參與事件的 chapterId 去重並依 order 排序 */
    function getCharacterChapters(characterId, events, chapters) {
      const orders = chapterOrderMap(chapters);
      const ids = new Set(events.filter((e) => e.characterIds.includes(characterId) && e.chapterId != null && orders.has(e.chapterId)).map((e) => e.chapterId));
      return [...ids].sort((a, b) => orders.get(a) - orders.get(b));
    }

    /** 7.5 自我檢查：網址加上 ?selftest 時執行 */
    function runSelfTest() {
      let pass = 0;
      let total = 0;
      const check = (cond, name) => { total++; if (cond) pass++; console.assert(cond, `自我檢查失敗：${name}`); };
      const chapters = [1, 2, 3, 4, 5].map((n) => ({ id: `c${n}`, order: n }));

      // 7.1 getActivePhase
      const rel = { phases: [
        { id: 'p1', startChapterId: 'c1', type: 'mentor' },
        { id: 'p2', startChapterId: 'c3', type: 'enemy' },
        { id: 'p3', startChapterId: 'c5', type: 'ended' },
      ] };
      check(getActivePhase(rel, 2, chapters)?.id === 'p1', '7.1 第 2 章仍為第一階段');
      check(getActivePhase(rel, 3, chapters)?.id === 'p2', '7.1 第 3 章進入第二階段');
      check(getActivePhase(rel, 5, chapters) === null, '7.1 ended 階段回傳 null');
      check(getActivePhase({ phases: [{ id: 'q', startChapterId: 'c2', type: 'friend' }] }, 1, chapters) === null, '7.1 尚未開始回傳 null');
      const rel2 = { phases: [{ id: 'r2', startChapterId: 'c4', type: 'ally' }, { id: 'r1', startChapterId: null, type: 'family' }] };
      check(getActivePhase(rel2, 1, chapters)?.id === 'r1', '7.1 startChapterId = null 視為第 0 章');
      check(getActivePhase(rel2, 4, chapters)?.id === 'r2', '7.1 不受陣列順序影響');

      // 7.2 markFlashbacks
      const evs = [
        { id: 'a', chapterId: 'c1', storyTimeSort: 10 },
        { id: 'b', chapterId: 'c2', storyTimeSort: 5 },
        { id: 'c', chapterId: null, storyTimeSort: 1 },
        { id: 'd', chapterId: 'c3', storyTimeSort: 20 },
        { id: 'e', chapterId: 'c4', storyTimeSort: 15 },
      ];
      const fb = markFlashbacks(evs);
      check(fb.has('b') && fb.has('e'), '7.2 小於先前最大值者為倒敘');
      check(!fb.has('a') && !fb.has('d'), '7.2 遞增者不是倒敘');
      check(!fb.has('c'), '7.2 背景事件不參與判斷');
      check(!markFlashbacks([{ id: 'x', chapterId: 'c1', storyTimeSort: 3 }, { id: 'y', chapterId: 'c2', storyTimeSort: 3 }]).has('y'), '7.2 時間相同不算倒敘');

      // 7.3 isOverdue / chaptersSincePlanted
      const work = { currentChapterId: 'c5', foreshadowWarnThreshold: 3 };
      const f1 = { status: 'open', plantedChapterId: 'c1', plannedPayoffChapterId: null };
      check(isOverdue(f1, work, chapters), '7.3 已埋章數達門檻即逾期');
      check(isOverdue({ status: 'open', plantedChapterId: 'c4', plannedPayoffChapterId: 'c4' }, work, chapters), '7.3 超過預計回收章即逾期');
      check(!isOverdue({ status: 'open', plantedChapterId: 'c3', plannedPayoffChapterId: 'c5' }, work, chapters), '7.3 未達條件不逾期');
      check(!isOverdue({ ...f1, status: 'resolved' }, work, chapters), '7.3 已回收不逾期');
      check(chaptersSincePlanted(f1, work, chapters) === 4, '7.3 已埋 4 章');
      check(chaptersSincePlanted(f1, { ...work, currentChapterId: null }, chapters) === 4, '7.3 未設定目前章節視為最後一章');

      // 7.4 getCharacterChapters
      const evs2 = [
        { chapterId: 'c3', characterIds: ['x'] },
        { chapterId: 'c1', characterIds: ['x', 'y'] },
        { chapterId: 'c3', characterIds: ['x'] },
        { chapterId: null, characterIds: ['x'] },
        { chapterId: 'c2', characterIds: ['y'] },
      ];
      check(JSON.stringify(getCharacterChapters('x', evs2, chapters)) === '["c1","c3"]', '7.4 去重、排除背景事件並依章節排序');
      check(JSON.stringify(getCharacterChapters('y', evs2, chapters)) === '["c1","c2"]', '7.4 第二個角色');
      check(getCharacterChapters('z', evs2, chapters).length === 0, '7.4 未參與任何事件');

      const msg = `自我檢查：通過 ${pass}／共 ${total}`;
      console.log(msg);
      toast(msg, pass === total ? 'success' : 'error');
      return { pass, total };
    }

    // ===== 6. 匯出／匯入、範例作品 =====
    function buildBackup(workIds) {
      const ids = new Set(workIds);
      const pick = (store) => state[store].filter((x) => ids.has(x.workId));
      return {
        app: APP_ID,
        schemaVersion: SCHEMA_VERSION,
        exportedAt: nowIso(),
        works: state.works.filter((w) => ids.has(w.id)),
        chapters: pick('chapters'),
        characters: pick('characters'),
        images: pick('images'),
        relationships: pick('relationships'),
        events: pick('events'),
        foreshadows: pick('foreshadows'),
      };
    }

    function exportAll() {
      if (!state.works.length) { toast('目前沒有作品可以匯出', 'warn'); return; }
      downloadJson(buildBackup(state.works.map((w) => w.id)), `inkweave-backup-${fileStamp(new Date(), true)}.json`);
      toast(`已匯出 ${state.works.length} 部作品`, 'success');
    }

    function exportWork(workId) {
      const work = getWork(workId);
      if (!work) return;
      downloadJson(buildBackup([workId]), `inkweave-${sanitizeFilename(work.title)}-${fileStamp(new Date(), false)}.json`);
      toast(`已匯出《${work.title}》`, 'success');
    }

    /**
     * 匯入備份（第 8.2 節）：驗證格式 → 為所有紀錄產生新 ID 並替換參照 → 單一 transaction 寫入。
     * asSample = true 時用於載入範例作品（不加「（匯入）」後綴，時間戳記設為現在）。
     */
    async function importBackup(data, { asSample = false } = {}) {
      if (!data || typeof data !== 'object' || data.app !== APP_ID) throw new Error('這不是墨織的備份檔');
      if (!SUPPORTED_SCHEMA_VERSIONS.includes(data.schemaVersion)) throw new Error(`不支援的備份檔版本（schemaVersion：${str(data.schemaVersion)}）`);
      const src = {};
      for (const s of STORES) {
        const seen = new Set();
        src[s] = (Array.isArray(data[s]) ? data[s] : []).filter((x) => {
          if (!x || typeof x !== 'object' || x.id == null || seen.has(String(x.id))) return false;
          seen.add(String(x.id));
          return true;
        });
      }
      if (!src.works.length) throw new Error('備份檔中沒有任何作品');

      // 舊 ID → 新 ID（每個 store 各自一張表）
      const maps = {};
      for (const s of STORES) maps[s] = new Map(src[s].map((rec) => [String(rec.id), uuid()]));
      const ref = (s, old) => (old == null || old === '' ? null : maps[s].get(String(old)) ?? null);
      const t = nowIso();
      // 範例作品：依原始順序給遞增的時間戳記，讓列表保持範例中的順序
      const baseMs = Date.now() - 60000;
      let seq = 0;
      const stamp = (rec) => {
        if (!asSample) return { createdAt: isoOr(rec.createdAt, t), updatedAt: isoOr(rec.updatedAt, t) };
        const at = new Date(baseMs + seq++).toISOString();
        return { createdAt: at, updatedAt: at };
      };
      const workIds = new Set(src.works.map((w) => ref('works', w.id)));
      const belongs = (rec) => { const id = ref('works', rec.workId); return id && workIds.has(id) ? id : null; };
      const out = {};
      STORES.forEach((s) => { out[s] = []; });

      // 章節（每部作品重新正規化 order）
      for (const c of src.chapters) {
        const workId = belongs(c);
        if (!workId) continue;
        out.chapters.push({ id: ref('chapters', c.id), workId, order: toNumber(c.order, 0), title: str(c.title).trim() || '未命名章節', summary: str(c.summary), ...stamp(c) });
      }
      for (const wid of workIds) {
        out.chapters.filter((c) => c.workId === wid).sort((a, b) => a.order - b.order).forEach((c, i) => { c.order = i + 1; });
      }
      const chapterWork = new Map(out.chapters.map((c) => [c.id, c.workId]));
      const chapterRef = (old, workId) => { const id = ref('chapters', old); return id && chapterWork.get(id) === workId ? id : null; };

      // 作品
      const existingTitles = new Set(state.works.map((w) => w.title));
      for (const w of src.works) {
        const id = ref('works', w.id);
        let title = str(w.title).trim() || '未命名作品';
        if (!asSample && existingTitles.has(title)) title += '（匯入）';
        out.works.push({
          id,
          title,
          description: str(w.description),
          currentChapterId: chapterRef(w.currentChapterId, id),
          foreshadowWarnThreshold: clamp(Math.round(toNumber(w.foreshadowWarnThreshold, DEFAULT_WARN_THRESHOLD)), 1, 999),
          ...stamp(w),
        });
      }

      // 圖片（只接受圖片 data URL）
      for (const img of src.images) {
        const workId = belongs(img);
        if (!workId || typeof img.dataUrl !== 'string' || !/^data:image\/(png|jpeg|jpg|webp|gif);base64,/i.test(img.dataUrl)) continue;
        out.images.push({ id: ref('images', img.id), workId, dataUrl: img.dataUrl, createdAt: asSample ? t : isoOr(img.createdAt, t) });
      }
      const imageIds = new Set(out.images.map((i) => i.id));

      // 角色
      const charWork = new Map();
      for (const c of src.characters) {
        const workId = belongs(c);
        if (!workId) continue;
        const avatar = ref('images', c.avatarImageId);
        const ch = {
          id: ref('characters', c.id),
          workId,
          name: str(c.name).trim() || '未命名角色',
          aliases: strList(c.aliases),
          avatarImageId: avatar && imageIds.has(avatar) ? avatar : null,
          color: /^#[0-9a-f]{6}$/i.test(c.color || '') ? c.color : CHARACTER_COLORS[out.characters.length % CHARACTER_COLORS.length],
          tags: strList(c.tags),
          appearance: str(c.appearance),
          personality: str(c.personality),
          catchphrase: str(c.catchphrase),
          motivation: str(c.motivation),
          secret: str(c.secret),
          customFields: (Array.isArray(c.customFields) ? c.customFields : []).filter((f) => f && typeof f === 'object').map((f) => ({ id: uuid(), key: str(f.key), value: str(f.value) })),
          notes: str(c.notes),
          graphPosition: c.graphPosition && Number.isFinite(Number(c.graphPosition.x)) && Number.isFinite(Number(c.graphPosition.y)) ? { x: Number(c.graphPosition.x), y: Number(c.graphPosition.y) } : null,
          ...stamp(c),
        };
        out.characters.push(ch);
        charWork.set(ch.id, workId);
      }
      const charRefs = (arr, workId) => uniq((Array.isArray(arr) ? arr : []).map((x) => ref('characters', x)).filter((id) => id && charWork.get(id) === workId));

      // 關係
      for (const r of src.relationships) {
        const workId = belongs(r);
        if (!workId) continue;
        const sourceId = ref('characters', r.sourceId);
        const targetId = ref('characters', r.targetId);
        if (!sourceId || !targetId || sourceId === targetId || charWork.get(sourceId) !== workId || charWork.get(targetId) !== workId) continue;
        const phases = (Array.isArray(r.phases) ? r.phases : []).filter((p) => p && typeof p === 'object').map((p) => ({
          id: uuid(),
          startChapterId: chapterRef(p.startChapterId, workId),
          type: Object.prototype.hasOwnProperty.call(RELATION_TYPES, p.type) ? p.type : 'other',
          label: str(p.label),
          note: str(p.note),
        }));
        if (!phases.length) continue;
        out.relationships.push({ id: ref('relationships', r.id), workId, sourceId, targetId, directed: !!r.directed, phases, ...stamp(r) });
      }

      // 事件
      for (const e of src.events) {
        const workId = belongs(e);
        if (!workId) continue;
        out.events.push({
          id: ref('events', e.id),
          workId,
          title: str(e.title).trim() || '未命名事件',
          description: str(e.description),
          storyTimeLabel: str(e.storyTimeLabel),
          storyTimeSort: toNumber(e.storyTimeSort, 0),
          chapterId: chapterRef(e.chapterId, workId),
          orderInChapter: toNumber(e.orderInChapter, 1),
          characterIds: charRefs(e.characterIds, workId),
          tags: strList(e.tags),
          ...stamp(e),
        });
      }
      const eventWork = new Map(out.events.map((e) => [e.id, e.workId]));

      // 伏筆
      for (const f of src.foreshadows) {
        const workId = belongs(f);
        if (!workId) continue;
        const planted = chapterRef(f.plantedChapterId, workId);
        if (!planted) throw new Error(`伏筆「${str(f.title)}」缺少有效的埋設章節`);
        let status = ['open', 'resolved', 'abandoned'].includes(f.status) ? f.status : 'open';
        const payoff = status === 'resolved' ? chapterRef(f.payoffChapterId, workId) : null;
        if (status === 'resolved' && !payoff) status = 'open';
        out.foreshadows.push({
          id: ref('foreshadows', f.id),
          workId,
          title: str(f.title).trim() || '未命名伏筆',
          description: str(f.description),
          plantedChapterId: planted,
          plannedPayoffChapterId: chapterRef(f.plannedPayoffChapterId, workId),
          payoffChapterId: payoff,
          status,
          characterIds: charRefs(f.characterIds, workId),
          eventIds: uniq((Array.isArray(f.eventIds) ? f.eventIds : []).map((x) => ref('events', x)).filter((id) => id && eventWork.get(id) === workId)),
          payoffNote: str(f.payoffNote),
          ...stamp(f),
        });
      }

      const ops = [];
      for (const s of STORES) out[s].forEach((rec) => ops.push(putOp(s, rec)));
      await commit(ops, { render: false });
      return out.works;
    }

    async function importFromFile(file) {
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch (err) {
        throw new Error('檔案不是有效的 JSON 格式');
      }
      const works = await importBackup(data);
      render();
      toast(`已匯入 ${works.length} 部作品`, 'success');
    }

    function toast(message, type = 'info') {
      const host = document.getElementById('toast');
      if (!host) return;
      const el = document.createElement('div');
      el.className = `toast-item toast-${type}`;
      el.setAttribute('role', type === 'error' ? 'alert' : 'status');
      el.textContent = message;
      host.appendChild(el);
      // 對話框開啟時，以 popover 讓提示顯示在最上層
      if (typeof host.showPopover === 'function') {
        try {
          if (!host.hasAttribute('popover')) host.setAttribute('popover', 'manual');
          if (host.matches(':popover-open')) host.hidePopover();
          host.showPopover();
        } catch (err) { /* 不支援時忽略 */ }
      }
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => {
          el.remove();
          if (!host.children.length && typeof host.hidePopover === 'function') {
            try { if (host.matches(':popover-open')) host.hidePopover(); } catch (err) { /* 忽略 */ }
          }
        }, 250);
      }, type === 'error' ? 5200 : 2600);
    }

    // --- 對話框 ---
    let modalState = null;

    /**
     * 開啟對話框，回傳 Promise。
     * onSubmit(formData, form) 回傳 { error } 會阻止關閉並顯示錯誤；回傳 false 則保持開啟；其他值作為結果。
     */
    function openModal({ title, body, submitText = '確定', cancelText = '取消', danger = false, wide = false, hideSubmit = false, onSubmit, onInput, onOpen }) {
      const modal = document.getElementById('modal');
      if (modalState) closeModal(null);
      return new Promise((resolve) => {
        modal.className = wide ? 'modal-wide' : '';
        modal.innerHTML = `
          <form class="modal-form" data-modal-form novalidate>
            <header class="modal-head">
              <h2 class="modal-title" id="modal-title">${escapeHtml(title)}</h2>
              <button type="button" class="btn btn-ghost icon-btn" data-action="modal-cancel" aria-label="關閉">${icon('x')}</button>
            </header>
            <div class="modal-body">${body}<p class="form-error" data-modal-error role="alert" hidden></p></div>
            <footer class="modal-foot">
              <button type="button" class="btn" data-action="modal-cancel">${escapeHtml(cancelText)}</button>
              ${hideSubmit ? '' : `<button type="submit" class="btn ${danger ? 'btn-danger-solid' : 'btn-primary'}">${escapeHtml(submitText)}</button>`}
            </footer>
          </form>`;
        modalState = { resolve, onSubmit, onInput };
        modal.showModal();
        const auto = modal.querySelector('[autofocus]');
        if (auto) { auto.focus(); if (typeof auto.select === 'function' && auto.value) auto.select(); }
        if (onOpen) onOpen(modal);
      });
    }

    function closeModal(result) {
      const modal = document.getElementById('modal');
      const current = modalState;
      modalState = null;
      if (modal.open) modal.close();
      if (current) current.resolve(result);
    }

    function setModalError(message) {
      const el = document.querySelector('#modal [data-modal-error]');
      if (!el) return;
      el.textContent = message || '';
      el.hidden = !message;
    }

    function handleModalSubmit(form) {
      if (!modalState) return;
      const fd = new FormData(form);
      let result = true;
      if (modalState.onSubmit) {
        try { result = modalState.onSubmit(fd, form); } catch (err) { result = { error: err.message }; }
      }
      if (result === false) return;
      if (result && typeof result === 'object' && 'error' in result && result.error) { setModalError(result.error); return; }
      closeModal(result);
    }

    function confirmDialog({ title = '請確認', message, confirmText = '確定', danger = false }) {
      return openModal({ title, body: `<div class="confirm-message">${message}</div>`, submitText: confirmText, danger }).then((r) => r === true);
    }

    function alertDialog({ title, message, closeText = '知道了' }) {
      return openModal({ title, body: `<div class="confirm-message">${message}</div>`, hideSubmit: true, cancelText: closeText });
    }

    // --- 章節選單、角色多選、頭像 ---
    function chapterLabel(chapter) { return `第 ${chapter.order} 章｜${chapter.title}`; }

    function chapterLabelById(chapterId, chapters) {
      const c = chapters.find((x) => x.id === chapterId);
      return c ? chapterLabel(c) : '';
    }

    /** 全站統一的章節下拉選項（第 N 章｜標題）；nullLabel 不為 null 時加入「空值」選項 */
    function chapterOptionsHtml(chapters, selectedId, nullLabel = null) {
      let html = nullLabel != null ? `<option value=""${selectedId ? '' : ' selected'}>${escapeHtml(nullLabel)}</option>` : '';
      for (const c of chapters) html += `<option value="${escapeHtml(c.id)}"${c.id === selectedId ? ' selected' : ''}>${escapeHtml(chapterLabel(c))}</option>`;
      return html;
    }

      const color = safeColor(character.color);

    /** 以 Canvas 壓縮圖片：最長邊 512px、webp（不支援則 jpeg）、品質 0.8 */
    async function compressImage(file) {
      if (!ACCEPTED_IMAGE_TYPES.includes(file.type)) throw new Error('只接受 JPG、PNG、WebP、GIF 格式的圖片');
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const im = new Image();
          im.onload = () => resolve(im);
          im.onerror = () => reject(new Error('無法讀取這張圖片'));
          im.src = url;
        });
        const w0 = img.naturalWidth || img.width;
        const h0 = img.naturalHeight || img.height;
        if (!w0 || !h0) throw new Error('無法讀取圖片尺寸');
        const scale = Math.min(1, AVATAR_MAX_SIDE / Math.max(w0, h0));
        const w = Math.max(1, Math.round(w0 * scale));
        const h = Math.max(1, Math.round(h0 * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        let dataUrl = canvas.toDataURL('image/webp', AVATAR_QUALITY);
        if (!dataUrl.startsWith('data:image/webp')) {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          dataUrl = canvas.toDataURL('image/jpeg', AVATAR_QUALITY);
        }
        return dataUrl;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    // --- 角色卡自動儲存（停止輸入 600ms 後儲存，不重繪整頁） ---
    const pendingCharacter = { id: null, patch: {} };
    const saveCharacterSoon = debounce(() => {
      const { id, patch } = pendingCharacter;
      pendingCharacter.id = null;
      pendingCharacter.patch = {};
      if (!id || !findById('characters', id) || !Object.keys(patch).length) return;
      updateCharacter(id, patch, { render: false })
        .then(() => setSaveStatus('saved'))
        .catch(() => setSaveStatus('error', '儲存失敗'));
    }, AUTOSAVE_DELAY);

    function queueCharacterPatch(id, patch, { immediate = false } = {}) {
      if (pendingCharacter.id && pendingCharacter.id !== id) saveCharacterSoon.flush();
      pendingCharacter.id = id;
      Object.assign(pendingCharacter.patch, patch);
      setSaveStatus('saving');
      saveCharacterSoon();
      if (immediate) saveCharacterSoon.flush();
    }

    function flushAutosave() { saveCharacterSoon.flush(); }

    function setSaveStatus(status, text) {
      const el = document.getElementById('save-status');
      if (!el) return;
      const labels = { idle: '變更會自動儲存', saving: '儲存中…', saved: '已儲存', error: '未儲存' };
      el.className = `save-status${status === 'idle' ? '' : ` is-${status}`}`;
      el.textContent = text || labels[status] || '';
    }

    // --- 總覽 ---
    function renderOverview(work) {
      const chapters = getChaptersByWork(work.id);
      const characters = getCharactersByWork(work.id);
      const events = getEventsByWork(work.id);
      const foreshadows = getForeshadowsByWork(work.id);
      const openCount = foreshadows.filter((f) => f.status === 'open').length;
      const resolvedCount = foreshadows.filter((f) => f.status === 'resolved').length;
      const orders = chapterOrderMap(chapters);
      const overdue = foreshadows.filter((f) => isOverdue(f, work, chapters))
        .sort((a, b) => (orders.get(a.plantedChapterId) ?? 0) - (orders.get(b.plantedChapterId) ?? 0));
      const currentOrder = getCurrentOrder(work, chapters);
      const current = chapters.find((c) => c.order === currentOrder);

      const stat = (page, iconName, label, value) => `<a class="stat" href="${workHref(work.id, page)}"><span class="stat-label">${icon(iconName)}${label}</span><span class="stat-value">${value}</span></a>`;
      const stats = `<div class="stats">
        ${stat('chapters', 'book', '章節', chapters.length)}
        ${stat('characters', 'users', '角色', characters.length)}
        ${stat('timeline', 'timeline', '事件', events.length)}
        ${stat('foreshadows', 'feather', '伏筆（未回收／已回收）', `${openCount}<small> ／ ${resolvedCount}</small>`)}
      </div>`;

      const currentCard = `<section class="card">
        <h2 class="card-title"><span>${icon('flag')}目前寫到</span></h2>
        ${chapters.length ? `
          <label class="label" for="overview-current">切換目前章節（伏筆逾期、關係圖預設都以此為準）</label>
          <select id="overview-current" class="select" data-action="set-current-chapter" data-work-id="${escapeHtml(work.id)}" style="margin-top:6px">
            ${chapterOptionsHtml(chapters, work.currentChapterId, '未設定（視為最後一章）')}
          </select>
          ${current ? `<div class="current-chapter-box"><h4>${escapeHtml(chapterLabel(current))}</h4><p class="small muted user-text" style="margin-top:4px">${escapeHtml(current.summary || '（尚無摘要）')}</p></div>` : ''}`
        : `<div class="empty-inline">尚無章節。<a href="${workHref(work.id, 'chapters')}">前往新增章節</a></div>`}
      </section>`;

      const overdueCard = `<section class="card">
        <h2 class="card-title"><span>${icon('alert')}逾期伏筆</span>${overdue.length ? `<span class="badge badge-solid-warn">${overdue.length}</span>` : ''}</h2>
        ${overdue.length ? `<div class="link-list">${overdue.map((f) => {
          const planted = chapters.find((c) => c.id === f.plantedChapterId);
          const n = chaptersSincePlanted(f, work, chapters);
          const planned = f.plannedPayoffChapterId ? chapters.find((c) => c.id === f.plannedPayoffChapterId) : null;
          const reason = planned && currentOrder > planned.order ? `已超過預計回收的第 ${planned.order} 章` : `超過逾期門檻（${work.foreshadowWarnThreshold} 章）`;
          return `<button type="button" class="list-link overdue-item" data-action="goto" data-href="${workHref(work.id, 'foreshadows')}" data-flash="${escapeHtml(f.id)}" data-tab="overdue">

        }).join('')}</div>` : `<div class="empty-inline">${icon('check')} 目前沒有逾期的伏筆，繼續保持！</div>`}
      </section>`;

      const recent = [
        ...characters.map((c) => ({ kind: '角色', title: c.name, at: c.updatedAt, href: workHref(work.id, 'characters', c.id), flash: null, ch: c })),
        ...events.map((e) => ({ kind: '事件', title: e.title, at: e.updatedAt, href: workHref(work.id, 'timeline'), flash: e.id })),
        ...foreshadows.map((f) => ({ kind: '伏筆', title: f.title, at: f.updatedAt, href: workHref(work.id, 'foreshadows'), flash: f.id })),
      ].sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 5);
      const recentCard = `<section class="card" style="margin-top:16px">
        <h2 class="card-title"><span>${icon('clock')}最近更新</span></h2>
        ${recent.length ? `<div class="link-list">${recent.map((r) => `
          <button type="button" class="list-link" data-action="goto" data-href="${r.href}"${r.flash ? ` data-flash="${escapeHtml(r.flash)}"` : ''}>
            <span class="badge recent-type ${r.kind === '角色' ? 'badge-accent' : r.kind === '伏筆' ? 'badge-warn' : 'badge-success'}">${r.kind}</span>

          <div class="chapter-row">

                <span class="badge">事件 ${chEvents.length}</span>

                <span class="badge">回收伏筆 ${resolved.length}</span>
              </div>
            </div>
            <div class="chapter-actions">
              <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="move-chapter" data-id="${escapeHtml(c.id)}" data-dir="-1" title="上移" aria-label="上移"${i === 0 ? ' disabled' : ''}>${icon('up')}</button>
              <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="move-chapter" data-id="${escapeHtml(c.id)}" data-dir="1" title="下移" aria-label="下移"${i === chapters.length - 1 ? ' disabled' : ''}>${icon('down')}</button>
              <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="edit-chapter" data-id="${escapeHtml(c.id)}" title="編輯" aria-label="編輯">${icon('edit')}</button>
              <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="delete-chapter" data-id="${escapeHtml(c.id)}" title="刪除" aria-label="刪除">${icon('trash')}</button>
              <button type="button" class="btn btn-sm" data-action="toggle-chapter" data-id="${escapeHtml(c.id)}" aria-expanded="${expanded}">${expanded ? '收合' : '展開'}${icon(expanded ? 'up' : 'down')}</button>
            </div>
          </div>
          ${detail}
        </li>`;
      }).join('');
      return head + `<ol class="chapter-list" id="chapter-list" data-work-id="${escapeHtml(work.id)}">${items}</ol>`
        + `<p class="hint" style="margin-top:12px">${icon('info')} 可用上移／下移按鈕，或按住左側 ⋮⋮ 拖曳調整順序；「第 N 章」編號會自動重新計算。</p>`;
    }

    // --- 角色卡詳細頁 ---
    function describeRelationState(rel, order, chapters) {
      const phase = getActivePhase(rel, order, chapters);
      if (phase) {
        const type = RELATION_TYPES[phase.type] || RELATION_TYPES.other;
        return { phase, text: `${phase.label || type.label}（${type.label}）`, color: type.color };
      }
      const sorted = sortPhases(rel, chapters);
      const started = sorted.some((p) => p.order <= order);
      return { phase: null, text: started ? '關係已結束' : '此時尚未開始', color: null };
    }

        <input class="input cf-value" id="cf-value-${escapeHtml(f.id)}" data-action="custom-field" placeholder="內容，例：17" value="${escapeHtml(f.value)}" aria-label="欄位內容">
        <button type="button" class="btn btn-ghost icon-btn" data-action="remove-custom-field" aria-label="刪除此欄位" title="刪除此欄位">${icon('trash')}</button>
      </div>`;
    }

    // --- 伏筆追蹤器 ---
    function foreshadowView(work) {
      const chapters = getChaptersByWork(work.id);
      const orders = chapterOrderMap(chapters);
      const all = getForeshadowsByWork(work.id).map((f) => ({ f, overdue: isOverdue(f, work, chapters) }));
      const counts = {
        open: all.filter((x) => x.f.status === 'open').length,
        resolved: all.filter((x) => x.f.status === 'resolved').length,
        abandoned: all.filter((x) => x.f.status === 'abandoned').length,
        overdue: all.filter((x) => x.overdue).length,
      };
      const filters = {
        all: () => true,
        open: (x) => x.f.status === 'open',
        overdue: (x) => x.overdue,
        resolved: (x) => x.f.status === 'resolved',
        abandoned: (x) => x.f.status === 'abandoned',
      };
      const list = all.filter(filters[ui.fsTab] || filters.all)
        .sort((a, b) => (b.overdue - a.overdue) || ((orders.get(a.f.plantedChapterId) ?? 0) - (orders.get(b.f.plantedChapterId) ?? 0)) || byCreated(a.f, b.f));
      return { chapters, all, counts, list };
    }

    function renderForeshadows(work) {
      const { chapters, all, counts, list } = foreshadowView(work);
      const head = pageHeadHtml('伏筆追蹤器', `超過 ${work.foreshadowWarnThreshold} 章未回收，或已超過預計回收章的伏筆會標示為逾期。`,
        chapters.length ? `<button type="button" class="btn btn-primary" data-action="new-foreshadow">${icon('plus')}新增伏筆</button>` : '');
      if (!chapters.length) {
        return head + emptyHtml('feather', '請先新增章節才能記錄伏筆', '伏筆需要記錄「埋在第幾章」，請先建立章節。',
          `<a class="btn btn-primary" href="${workHref(work.id, 'chapters')}">${icon('book')}前往章節頁</a>`);
      }
      const stat = (label, value, warn = false) => `<div class="fs-stat${warn && value ? ' is-warn' : ''}"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
      const tabs = [['all', '全部', all.length], ['open', '未回收', counts.open], ['overdue', '逾期', counts.overdue], ['resolved', '已回收', counts.resolved], ['abandoned', '已放棄', counts.abandoned]];
      const currentOrder = getCurrentOrder(work, chapters);
      const items = list.map(({ f, overdue }) => {
        const n = chaptersSincePlanted(f, work, chapters);
        const plantedLabel = chapterLabelById(f.plantedChapterId, chapters);
        const planned = f.plannedPayoffChapterId ? chapters.find((c) => c.id === f.plannedPayoffChapterId) : null;
        const payoff = f.payoffChapterId ? chapters.find((c) => c.id === f.payoffChapterId) : null;
        const plantedOrder = chapters.find((c) => c.id === f.plantedChapterId)?.order ?? 0;
        let age = '';
        if (f.status === 'open') age = n < 0 ? '<span>尚未寫到埋設章</span>' : `<span class="${overdue ? 'warn' : ''}">已埋 ${n} 章</span>`;
        else if (f.status === 'resolved' && payoff) age = `<span>歷時 ${payoff.order - plantedOrder} 章回收</span>`;
        const people = f.characterIds.map((id) => findById('characters', id)).filter(Boolean);
        const evs = f.eventIds.map((id) => findById('events', id)).filter(Boolean);
        return `<article class="fs-item${overdue ? ' is-overdue' : ''}${f.status === 'abandoned' ? ' is-muted' : ''}" id="item-${escapeHtml(f.id)}">
          <div class="fs-main">
            <div class="fs-title-row"><h3>${escapeHtml(f.title)}</h3>${statusBadgeHtml(f, work, chapters)}</div>
            <div class="fs-meta">
              <span>埋設：<strong>${escapeHtml(plantedLabel)}</strong></span>
              ${age}
              ${planned ? `<span${overdue && currentOrder > planned.order ? ' class="warn"' : ''}>預計回收：第 ${planned.order} 章</span>` : ''}
              ${payoff ? `<span>實際回收：<strong>${escapeHtml(chapterLabel(payoff))}</strong></span>` : ''}
            </div>
            ${f.description ? `<p class="fs-desc user-text">${escapeHtml(f.description)}</p>` : ''}
            ${people.length || evs.length ? `<div class="fs-links">
              ${people.map((c) => `<a class="tag" href="${workHref(work.id, 'characters', c.id)}" style="gap:5px">${avatarHtml(c, 'xs')}${escapeHtml(c.name)}</a>`).join('')}
              ${evs.map((e) => `<button type="button" class="tag" data-action="goto" data-href="${workHref(work.id, 'timeline')}" data-flash="${escapeHtml(e.id)}">${icon('timeline')}${escapeHtml(e.title)}</button>`).join('')}
            </div>` : ''}
            ${f.payoffNote ? `<div class="fs-note user-text"><strong>${f.status === 'abandoned' ? '放棄原因' : '回收方式'}：</strong>${escapeHtml(f.payoffNote)}</div>` : ''}
          </div>
          <div class="fs-actions">
            ${f.status === 'open' ? `<button type="button" class="btn btn-sm btn-primary" data-action="resolve-foreshadow" data-id="${escapeHtml(f.id)}">${icon('check')}標記為已回收</button>` : ''}
            <div class="btn-group">
              <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="edit-foreshadow" data-id="${escapeHtml(f.id)}" title="編輯" aria-label="編輯">${icon('edit')}</button>
              <button type="button" class="btn btn-ghost icon-btn btn-sm" data-action="delete-foreshadow" data-id="${escapeHtml(f.id)}" title="刪除" aria-label="刪除">${icon('trash')}</button>
            </div>
          </div>
        </article>`;
      }).join('');
      return head + `
        <div class="fs-stats">${stat('未回收', counts.open)}${stat('已回收', counts.resolved)}${stat('已放棄', counts.abandoned)}${stat('逾期', counts.overdue, true)}</div>
        <div class="fs-toolbar">
          <div class="tabs" role="tablist">${tabs.map(([key, label, n]) => `<button type="button" role="tab" class="tab${ui.fsTab === key ? ' active' : ''}${key === 'overdue' && n ? ' tab-warn' : ''}" aria-selected="${ui.fsTab === key}" data-action="fs-tab" data-tab="${key}">${label}<span class="count">${n}</span></button>`).join('')}</div>
          <button type="button" class="btn btn-sm" data-action="toggle-span">${icon('chart')}${ui.showSpan ? '隱藏跨度圖' : '顯示跨度圖'}</button>
        </div>
        ${ui.showSpan && list.length ? `<section class="card span-card"><h2 class="card-title" style="margin-bottom:4px"><span>${icon('chart')}伏筆跨度圖</span></h2><p class="hint" style="margin-bottom:10px">橫軸為章節，虛線為目前章節；點擊橫條可跳到該伏筆。</p><div class="span-scroll">${spanChartSvg(work, chapters, list)}</div></section>` : ''}
        ${list.length ? `<div class="fs-list">${items}</div>` : emptyHtml('feather', all.length ? '這個分類沒有伏筆' : '還沒有伏筆', all.length ? '切換其他分頁看看。' : '把埋下的線索記下來，墨織會提醒你回收。',
          all.length ? '' : `<button type="button" class="btn btn-primary" data-action="new-foreshadow">${icon('plus')}新增第一個伏筆</button>`)}`;
    }

    /** 伏筆跨度圖：每條伏筆從埋設章到回收章（未回收則到目前章）的橫條 */
    function spanChartSvg(work, chapters, list) {
      const n = chapters.length;
      const labelW = 170;
      const colW = n > 20 ? 30 : 46;
      const rowH = 30;
      const top = 34;
      const width = labelW + n * colW + 16;
      const height = top + list.length * rowH + 10;
      const currentOrder = getCurrentOrder(work, chapters);
      const orderOf = (id) => chapters.find((c) => c.id === id)?.order ?? null;
      const x = (order) => labelW + (order - 1) * colW;
      let grid = '';
      chapters.forEach((c) => {
        grid += `<line class="span-grid" x1="${x(c.order)}" y1="${top - 6}" x2="${x(c.order)}" y2="${height - 6}"/>`;
        grid += `<text class="span-axis" x="${x(c.order) + colW / 2}" y="${top - 12}">${c.order}</text>`;
      });
      grid += `<line class="span-grid" x1="${x(n + 1)}" y1="${top - 6}" x2="${x(n + 1)}" y2="${height - 6}"/>`;
      const curX = x(currentOrder) + colW / 2;
      const rows = list.map(({ f, overdue }, i) => {
        const start = orderOf(f.plantedChapterId) ?? 1;
        let end = start;
        if (f.status === 'resolved') end = orderOf(f.payoffChapterId) ?? start;
        else if (f.status === 'open') end = Math.max(start, currentOrder);
        const cls = f.status === 'resolved' ? 'is-resolved' : f.status === 'abandoned' ? 'is-abandoned' : overdue ? 'is-overdue' : '';
        const y = top + i * rowH;
        const bx = x(Math.min(start, end)) + 5;
        const bw = Math.max(colW - 10, (Math.abs(end - start) + 1) * colW - 10);
        return `<g class="span-row" data-action="span-jump" data-flash="${escapeHtml(f.id)}" tabindex="0" role="button" aria-label="${escapeHtml(f.title)}">
          <title>${escapeHtml(f.title)}：第 ${start} 章 → ${f.status === 'resolved' ? `第 ${end} 章回收` : f.status === 'abandoned' ? '已放棄' : `目前第 ${end} 章（未回收）`}</title>
          <text class="span-label" x="8" y="${y + rowH / 2 + 4}">${escapeHtml(truncateText(f.title, 11))}</text>
          <rect class="span-bar ${cls}" x="${bx}" y="${y + 7}" width="${bw}" height="${rowH - 14}" rx="${(rowH - 14) / 2}"/>
        </g>`;
      }).join('');
      return `<svg id="span-svg" viewBox="0 0 ${width} ${height}" style="min-width:${Math.min(width, 560)}px;max-width:${Math.round(width * 1.3)}px" role="img" aria-label="伏筆跨度圖">
        ${grid}
        ${currentOrder ? `<line class="span-current" x1="${curX}" y1="${top - 6}" x2="${curX}" y2="${height - 6}"/><text class="span-current-label" x="${curX}" y="${top - 24}">目前</text>` : ''}
        ${rows}
      </svg>`;
    }

    function foreshadowFormHtml(work, f) {
      const chapters = getChaptersByWork(work.id);
      return `
        <div class="field"><label for="f-title">標題 <span class="req">*</span></label>
          <input id="f-title" name="title" class="input" maxlength="80" required autofocus value="${escapeHtml(f.title)}" placeholder="例：斷掉的玉珮"></div>
        <div class="field"><label for="f-desc">描述（伏筆內容與預計的真相）</label>
          <textarea id="f-desc" name="description" class="textarea" rows="3">${escapeHtml(f.description)}</textarea></div>
        <div class="form-row">
          <div class="field"><label for="f-planted">埋設章節 <span class="req">*</span></label>
            <select id="f-planted" name="plantedChapterId" class="select" required>${chapterOptionsHtml(chapters, f.plantedChapterId)}</select></div>
          <div class="field"><label for="f-planned">預計回收章節</label>
            <select id="f-planned" name="plannedPayoffChapterId" class="select">${chapterOptionsHtml(chapters, f.plannedPayoffChapterId, '未設定')}</select></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="f-status">狀態</label>
            <select id="f-status" name="status" class="select">${Object.entries(FORESHADOW_STATUS).map(([k, v]) => `<option value="${k}"${f.status === k ? ' selected' : ''}>${v.label}</option>`).join('')}</select></div>
          <div class="field" data-payoff-field${f.status === 'resolved' ? '' : ' hidden'}><label for="f-payoff">實際回收章節 <span class="req">*</span></label>
            <select id="f-payoff" name="payoffChapterId" class="select">${chapterOptionsHtml(chapters, f.payoffChapterId, '請選擇')}</select></div>
        </div>
        <div class="field"><span class="label">相關角色</span>${characterPickerHtml(getCharactersByWork(work.id), f.characterIds)}</div>
        <div class="field"><span class="label">相關事件</span>${eventPickerHtml(getEventsByWork(work.id), f.eventIds, chapters)}</div>
        <div class="field"><label for="f-note">回收方式備註</label>
          <textarea id="f-note" name="payoffNote" class="textarea" rows="2" placeholder="打算如何回收，或放棄的原因">${escapeHtml(f.payoffNote)}</textarea></div>`;
    }

    function readForeshadowForm(fd, chapters) {
      const orderOf = (id) => chapters.find((c) => c.id === id)?.order ?? null;
      const data = {
        title: str(fd.get('title')).trim(),
        description: str(fd.get('description')).trim(),
        plantedChapterId: str(fd.get('plantedChapterId')) || null,
        plannedPayoffChapterId: str(fd.get('plannedPayoffChapterId')) || null,
        status: str(fd.get('status')) || 'open',
        payoffChapterId: str(fd.get('payoffChapterId')) || null,
        characterIds: fd.getAll('characterIds').map(String),
        eventIds: fd.getAll('eventIds').map(String),
        payoffNote: str(fd.get('payoffNote')).trim(),
      };
      if (!data.title) return { error: '請輸入伏筆標題' };
      if (!data.plantedChapterId) return { error: '請選擇埋設章節' };
      if (data.status !== 'resolved') data.payoffChapterId = null;
      if (data.status === 'resolved' && !data.payoffChapterId) return { error: '狀態為「已回收」時，必須選擇實際回收章節' };
      const planted = orderOf(data.plantedChapterId);
      if (data.plannedPayoffChapterId && orderOf(data.plannedPayoffChapterId) < planted) return { error: '預計回收章節不能早於埋設章節' };
      if (data.payoffChapterId && orderOf(data.payoffChapterId) < planted) return { error: '實際回收章節不能早於埋設章節' };
      return { data };
    }

    // --- 角色關係圖 ---
    function graphState(workId) {
      if (ui.graph.workId !== workId) {
        ui.graph = { workId, chapterOrder: null, showAll: false, selected: null, view: { x: 0, y: 0, k: 1 }, drag: null };
      }
      return ui.graph;
    }

    function graphContext(work) {
      const chapters = getChaptersByWork(work.id);
      const g = graphState(work.id);
      let order = g.chapterOrder ?? getCurrentOrder(work, chapters);
      order = chapters.length ? clamp(order, 1, chapters.length) : 0;
      return { work, chapters, characters: getCharactersByWork(work.id), relationships: getRelationshipsByWork(work.id), g, order };
    }

    function currentGraphContext() {
      const route = parseRoute();
      const work = route.workId ? getWork(route.workId) : null;
      return work && route.name === 'relations' ? graphContext(work) : null;
    }

    function visibleRelations(ctx) {
      return ctx.relationships
        .map((rel) => ({ rel, phase: ctx.g.showAll ? getLatestPhase(rel, ctx.chapters) : getActivePhase(rel, ctx.order, ctx.chapters) }))
        .filter((x) => x.phase);
    }

    /** 節點位置：已存位置優先；沒有位置的角色以圓形排列在畫布中央 */
    function nodePositions(characters, g) {
      const map = new Map();
      const unplaced = characters.filter((c) => !isValidPos(c.graphPosition));
      const n = unplaced.length;
      const radius = n <= 1 ? 0 : Math.min(225, 60 + n * 22);
      unplaced.forEach((c, i) => {
        const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
        map.set(c.id, { x: GRAPH_W / 2 + radius * Math.cos(a), y: GRAPH_H / 2 + radius * Math.sin(a) });
      });
      characters.forEach((c) => { if (isValidPos(c.graphPosition)) map.set(c.id, { x: c.graphPosition.x, y: c.graphPosition.y }); });
      if (g.drag && g.drag.kind === 'node' && g.drag.pos) map.set(g.drag.id, g.drag.pos);
      return map;
    }

    /** 依節點範圍計算 viewBox，讓關係圖在各種畫布比例下都盡量填滿（拖曳時不重算，避免畫面跳動） */
    function fitViewBox(ctx) {
      const pts = [...nodePositions(ctx.characters, ctx.g).values()];
      if (!pts.length) return `0 0 ${GRAPH_W} ${GRAPH_H}`;
      let minX = Math.min(...pts.map((p) => p.x)) - NODE_R - 56;
      let maxX = Math.max(...pts.map((p) => p.x)) + NODE_R + 56;
      let minY = Math.min(...pts.map((p) => p.y)) - NODE_R - 30;
      let maxY = Math.max(...pts.map((p) => p.y)) + NODE_R + 48;
      const minW = 440;
      const minH = 360;
      if (maxX - minX < minW) { const c = (minX + maxX) / 2; minX = c - minW / 2; maxX = c + minW / 2; }
      if (maxY - minY < minH) { const c = (minY + maxY) / 2; minY = c - minH / 2; maxY = c + minH / 2; }
      return `${f1(minX)} ${f1(minY)} ${f1(maxX - minX)} ${f1(maxY - minY)}`;
    }

    function refitGraph() {
      const svg = document.getElementById('graph-svg');
      const ctx = currentGraphContext();
      if (svg && ctx) svg.setAttribute('viewBox', fitViewBox(ctx));
    }

    function graphCenter() {
      const vb = document.getElementById('graph-svg')?.viewBox?.baseVal;
      return vb && vb.width ? { x: vb.x + vb.width / 2, y: vb.y + vb.height / 2 } : { x: GRAPH_W / 2, y: GRAPH_H / 2 };
    }

    function towards(p, q, dist) {
      const dx = q.x - p.x;
      const dy = q.y - p.y;
      const len = Math.hypot(dx, dy);
      if (len < 0.001) return { x: p.x, y: p.y };
      return { x: p.x + (dx / len) * dist, y: p.y + (dy / len) * dist };
    }

    const f1 = (n) => Math.round(n * 10) / 10;
    const viewTransform = (v) => `translate(${f1(v.x)} ${f1(v.y)}) scale(${Math.round(v.k * 1000) / 1000})`;

    function graphSvgInner(ctx) {
      const { characters, g } = ctx;
      const pos = nodePositions(characters, g);
      const vis = visibleRelations(ctx);
      const sel = g.selected;
      const selRel = sel?.kind === 'edge' ? findById('relationships', sel.id) : null;
      const connected = new Set();
      if (sel?.kind === 'node') {
        connected.add(sel.id);
        vis.forEach((v) => { if (v.rel.sourceId === sel.id || v.rel.targetId === sel.id) { connected.add(v.rel.sourceId); connected.add(v.rel.targetId); } });
      }

      const markers = Object.entries(RELATION_TYPES).filter(([, d]) => d.color)
        .map(([t, d]) => `<marker id="arrow-${t}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="${d.color}"/></marker>`).join('');

      // 同一對角色的關係分組，以弧線錯開
      const groups = new Map();
      for (const v of vis) {
        if (!pos.has(v.rel.sourceId) || !pos.has(v.rel.targetId)) continue;
        const key = [v.rel.sourceId, v.rel.targetId].sort().join('|');
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(v);
      }
      let edges = '';
      let labels = '';
      for (const [key, list] of groups) {
        const [aId, bId] = key.split('|');
        const A = pos.get(aId);
        const B = pos.get(bId);
        const len = Math.hypot(B.x - A.x, B.y - A.y) || 1;
        const nx = -(B.y - A.y) / len;
        const ny = (B.x - A.x) / len;
        const mx = (A.x + B.x) / 2;
        const my = (A.y + B.y) / 2;
        list.forEach((v, i) => {
          const offset = (i - (list.length - 1) / 2) * 54;
          const C = { x: mx + nx * offset * 2, y: my + ny * offset * 2 };
          const S = pos.get(v.rel.sourceId);
          const T = pos.get(v.rel.targetId);
          const start = towards(S, C, NODE_R + 4);
          const end = towards(T, C, NODE_R + (v.rel.directed ? 6 : 4));
          const lx = 0.25 * start.x + 0.5 * C.x + 0.25 * end.x;
          const ly = 0.25 * start.y + 0.5 * C.y + 0.25 * end.y;
          const type = RELATION_TYPES[v.phase.type] || RELATION_TYPES.other;
          const typeKey = RELATION_TYPES[v.phase.type] ? v.phase.type : 'other';
          const label = v.phase.label || type.label;
          const d = `M${f1(start.x)} ${f1(start.y)} Q${f1(C.x)} ${f1(C.y)} ${f1(end.x)} ${f1(end.y)}`;
          let cls = 'edge';
          if (selRel && selRel.id === v.rel.id) cls += ' selected';
          else if (selRel || (sel?.kind === 'node' && v.rel.sourceId !== sel.id && v.rel.targetId !== sel.id)) cls += ' dim';
          const id = escapeHtml(v.rel.id);
          const w = textWidth(label, 12.5) + 16;
          edges += `<g class="${cls}" data-edge-id="${id}"><path class="edge-hit" d="${d}"/><path class="edge-line" d="${d}" stroke="${type.color}"${v.rel.directed ? ` marker-end="url(#arrow-${typeKey})"` : ''}/></g>`;
          labels += `<g class="${cls}" data-edge-id="${id}"><rect class="edge-pill" x="${f1(lx - w / 2)}" y="${f1(ly - 11)}" width="${f1(w)}" height="22" rx="11" style="stroke:${type.color}"/><text class="edge-label" x="${f1(lx)}" y="${f1(ly)}">${escapeHtml(label)}</text></g>`;
        });
      }

      let clips = '';
      let nodes = '';
      characters.forEach((c, i) => {
        const p = pos.get(c.id);
        const color = safeColor(c.color);
        const url = c.avatarImageId ? getImageUrl(c.avatarImageId) : null;
        let cls = 'node';
        if (sel?.kind === 'node' && sel.id === c.id) cls += ' selected';
        else if (sel?.kind === 'node' && !connected.has(c.id)) cls += ' dim';
        else if (selRel && selRel.sourceId !== c.id && selRel.targetId !== c.id) cls += ' dim';
        if (g.drag?.kind === 'node' && g.drag.id === c.id && g.drag.moved) cls += ' dragging';
        if (url) clips += `<clipPath id="node-clip-${i}"><circle r="${NODE_R}"/></clipPath>`;
        nodes += `<g class="${cls}" data-node-id="${escapeHtml(c.id)}" transform="translate(${f1(p.x)} ${f1(p.y)})">
          <title>${escapeHtml(c.name)}</title>
          <circle class="node-halo" r="${NODE_R + 9}"/>
          <circle class="node-ring" r="${NODE_R + 2}" style="stroke:${color}"/>
          ${url
            ? `<image href="${escapeHtml(url)}" x="${-NODE_R}" y="${-NODE_R}" width="${NODE_R * 2}" height="${NODE_R * 2}" clip-path="url(#node-clip-${i})" preserveAspectRatio="xMidYMid slice"/>`
            : `<circle r="${NODE_R}" style="fill:${color}"/><text class="node-initial" style="fill:${contrastText(color)}">${escapeHtml(firstChar(c.name))}</text>`}
          <text class="node-name" y="${NODE_R + 21}">${escapeHtml(c.name)}</text>
        </g>`;
      });
      return `<defs>${markers}${clips}</defs><g id="graph-viewport" transform="${viewTransform(g.view)}"><g>${edges}</g><g>${labels}</g><g>${nodes}</g></g>`;
    }

    function graphPanelHtml(ctx) {
      const sel = ctx.g.selected;
      const when = ctx.g.showAll ? '最新狀態' : ctx.chapters.length ? `第 ${ctx.order} 章時` : '目前';
      if (sel?.kind === 'node') {
        const c = findById('characters', sel.id);
        if (c && c.workId === ctx.work.id) {
          const rels = ctx.relationships.filter((r) => r.sourceId === c.id || r.targetId === c.id);
          const items = rels.map((r) => {
            const other = findById('characters', r.sourceId === c.id ? r.targetId : r.sourceId);
            if (!other) return '';
            const phase = ctx.g.showAll ? getLatestPhase(r, ctx.chapters) : getActivePhase(r, ctx.order, ctx.chapters);
            const type = phase ? RELATION_TYPES[phase.type] || RELATION_TYPES.other : null;
            const arrow = r.directed ? (r.sourceId === c.id ? '→' : '←') : '↔';
            return `<button type="button" class="assoc-item" data-action="graph-select" data-kind="edge" data-id="${escapeHtml(r.id)}">
              ${avatarHtml(other, 'sm')}<span class="grow"><strong>${arrow} ${escapeHtml(other.name)}</strong>
              <span class="sub">${type ? `<span class="type-dot" style="background:${type.color}"></span> ${escapeHtml(phase.label || type.label)}` : '此時沒有關係'}</span></span></button>`;
          }).join('');
          return `<div class="panel-head">${avatarHtml(c, 'lg')}<div style="min-width:0"><h3>${escapeHtml(c.name)}</h3>
              ${c.aliases.length ? `<div class="small muted">${escapeHtml(c.aliases.join('・'))}</div>` : ''}
              ${c.tags.length ? `<div class="tag-list" style="margin-top:6px">${c.tags.map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}</div></div>
            ${c.motivation ? `<p class="small muted user-text"><strong>動機：</strong>${escapeHtml(truncateText(c.motivation, 80))}</p>` : ''}
            <a class="btn btn-sm btn-primary" style="margin-top:12px" href="${workHref(ctx.work.id, 'characters', c.id)}">${icon('user')}開啟角色卡</a>
            <div class="panel-section"><h4>人際關係（${when}）</h4>${rels.length ? `<div class="assoc-list">${items}</div>` : '<div class="empty-inline">尚無關係</div>'}</div>`;
        }
      }
      if (sel?.kind === 'edge') {
        const r = findById('relationships', sel.id);
        if (r && r.workId === ctx.work.id) {
          const src = findById('characters', r.sourceId);
          const tgt = findById('characters', r.targetId);
          const active = ctx.g.showAll ? getLatestPhase(r, ctx.chapters) : getActivePhase(r, ctx.order, ctx.chapters);
          const phases = sortPhases(r, ctx.chapters).map(({ phase, order }) => {
            const type = RELATION_TYPES[phase.type] || RELATION_TYPES.other;

              <span class="who">${src ? avatarHtml(src, 'md') : ''}${escapeHtml(src?.name || '?')}</span>

            <div class="panel-section"><h4>關係階段（共 ${r.phases.length} 個）</h4><ol class="phase-list">${phases}</ol></div>
            <div class="panel-actions">
              <button type="button" class="btn btn-sm btn-primary" data-action="add-phase" data-rel-id="${escapeHtml(r.id)}">${icon('plus')}新增階段</button>
              <button type="button" class="btn btn-sm btn-danger" data-action="delete-relation" data-rel-id="${escapeHtml(r.id)}">${icon('trash')}刪除關係</button>
            </div>`;
        }
      }
      return `<div class="panel-empty">${icon('graph')}<p>點選角色節點或關係連線，<br>即可在這裡查看與編輯。</p>
        <ul class="panel-tips"><li>拖曳節點可調整位置，會自動儲存</li><li>拖曳空白處平移；滾輪或右下角按鈕縮放</li><li>拖動上方章節滑桿，看關係如何隨劇情變化</li></ul></div>`;
    }

    function renderRelations(work) {

              <button type="button" class="btn" data-action="graph-zoom" data-dir="out" title="縮小" aria-label="縮小">${icon('minus')}</button>

            </div>
          </div>
          <aside class="graph-panel" id="graph-panel" aria-live="polite">${graphPanelHtml(ctx)}</aside>

        <div class="legend"><strong style="color:var(--text)">圖例</strong>${legend}<span class="legend-item">→ 箭頭代表單向關係</span></div>`;
